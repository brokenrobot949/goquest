<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Go Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#14110f; --bg2:#1c1815; --panel:#221d19; --line:#3a322b;
  --ink:#e8dcc8; --ink-dim:#a1907a; --ink-mute:#6f6355;
  --gold:#c9a227; --gold-lit:#e8c25a;
  --blood:#a33b32; --leaf:#6f9a5c; --sky:#5b87b8;
  /* headline family only — wordmark, section headings, title rule. --gold
     keeps sole ownership of loot/currency/tier semantics; do not repaint it. */
  --head:#7cbf85;
  /* gear quality tiers — design doc §9, exact hex values */
  --tier-common:#9ca3af; --tier-uncommon:#4ade80; --tier-rare:#60a5fa;
  --tier-epic:#c084fc; --tier-legendary:#fbbf24;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:Inter,system-ui,sans-serif; font-size:15px; line-height:1.5;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:620px; margin:0 auto; padding:16px 14px 64px}
h1,h2,h3{font-family:Cinzel,Georgia,serif; font-weight:700; margin:0}
.title{text-align:center; letter-spacing:.22em; font-size:26px; color:var(--head);
  padding:12px 0 4px; text-transform:uppercase}
.title-rule{height:1px; background:linear-gradient(90deg,transparent,var(--head) 20%,var(--head) 80%,transparent); margin:0 0 18px; opacity:.55}

.card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px}
.card h2{font-size:15px; letter-spacing:.12em; text-transform:uppercase; color:var(--head); margin-bottom:10px}
.muted{color:var(--ink-dim)}
.tiny{font-size:12.5px}

/* bars */
.bar{height:9px; background:#0e0b09; border:1px solid var(--line); border-radius:5px; overflow:hidden}
.bar > i{display:block; height:100%; background:var(--leaf); transition:width .25s linear}
.bar.hp > i{background:linear-gradient(90deg,#8c2f28,#c04a3e)}
.bar.xp > i{background:linear-gradient(90deg,#7a5f16,var(--gold))}
.bar.task > i{background:linear-gradient(90deg,#3f5f7f,var(--sky))}
.barrow{display:grid; grid-template-columns:34px 1fr auto; gap:9px; align-items:center; margin:7px 0; font-size:12.5px}
.barrow b{color:var(--ink-dim); font-weight:500; letter-spacing:.06em}
.barrow span{color:var(--ink-dim); white-space:nowrap}

.heroline{font-family:Cinzel,serif; font-size:19px; color:var(--ink)}
.herosub{font-size:13px; color:var(--ink-dim); margin-top:2px}
.footrow{display:flex; justify-content:space-between; align-items:center; margin-top:11px;
  padding-top:10px; border-top:1px solid var(--line); font-size:13px}
.zonedot{color:var(--leaf)}
.gold{color:var(--gold)}

/* tabs */
.tabs{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:12px}
.tabs button{
  font:inherit; font-size:13px; letter-spacing:.05em; padding:10px 4px; cursor:pointer;
  background:var(--bg2); color:var(--ink-dim); border:1px solid var(--line); border-radius:8px;
}
.tabs button[aria-selected="true"]{background:var(--panel); color:var(--gold); border-color:var(--gold)}

/* stats */
.statgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px 14px}
.stat{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--line)}
.stat b{font-weight:500; color:var(--ink-dim)}
.stat i{font-style:normal; font-variant-numeric:tabular-nums}
.effects{margin-top:12px; font-size:12.5px; color:var(--ink-dim)}
.effects div{padding:3px 0}

/* gear */
.gearlist{display:flex; flex-direction:column}
.gearslot{padding:9px 0; border-bottom:1px solid var(--line)}
.gearslot:last-child{border-bottom:none}
.gearslot b{display:block; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-mute)}
.itemname{font-family:Cinzel,serif; font-size:14.5px; margin-top:2px}

/* learned skills — a record of what the hero has become, not disabled UI, so
   they get a proper readable title tone instead of inheriting .gearslot's
   muted uppercase slot-label style (which is what made them fade out). */
.skill-row{padding:9px 0; border-bottom:1px solid var(--line)}
.skill-row:last-child{border-bottom:none}
.skill-row .skill-title{display:block; font-family:Cinzel,serif; font-size:14.5px; color:var(--head)}

/* chronicle — sessions (real sittings, by time-gap) each hold chapter breaks
   (zone arrivals) and entries. Rendered strict newest-first throughout: newest
   sitting on top, and within it entries run newest-to-oldest, so the very top
   line is always the most recent thing that happened. */
.log{display:flex; flex-direction:column}
.session-head{display:flex; align-items:center; gap:10px; margin:22px 0 12px;
  color:var(--ink-mute); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase}
.session:first-child .session-head{margin-top:0}
.session-head::before, .session-head::after{content:""; flex:1; height:1px; background:var(--line)}

/* chapter break — a zone arrival (Act transition), the chronicle's chapter headers */
.chapter{text-align:center; margin:26px 0 18px; padding:0 4px}
.chapter .chapter-rule{height:1px; margin:0 auto 12px; max-width:140px;
  background:linear-gradient(90deg,transparent,var(--gold) 30%,var(--gold) 70%,transparent)}
.chapter b{display:block; font-family:Cinzel,serif; font-size:16.5px; letter-spacing:.06em;
  color:var(--gold-lit); overflow-wrap:anywhere}
.chapter span{display:block; font-size:12.5px; color:var(--ink-dim); margin-top:7px;
  font-family:Inter,sans-serif; line-height:1.65; overflow-wrap:anywhere}

.entry{padding:5px 0; border-bottom:1px solid #2a241f; font-size:13.5px; color:var(--ink-mute);
  overflow-wrap:anywhere}
.entry time{color:#4d443a; font-variant-numeric:tabular-nums; margin-right:8px; font-size:12px}
.entry.imp0{font-size:12.5px; opacity:.75}
.entry.imp1{color:var(--ink)}
.entry.imp2{color:var(--ink); background:#1a1613; border-left:2px solid var(--gold);
  padding:10px 12px; margin:8px 0; border-bottom:none; border-radius:0 6px 6px 0;
  font-family:Cinzel,serif; font-size:14px; line-height:1.6}
.entry.imp2 time{display:block; margin:0 0 4px; font-family:Inter,sans-serif}

/* weight for the entries that matter most — death/ascension carry the most,
   cheat-death and rare drops catch the eye via the tier colors already defined */
.entry.k-death{border-left-color:var(--blood); background:#201412}
.entry.k-ascension{border-left-color:var(--gold-lit); background:#241d10;
  box-shadow:0 0 0 1px rgba(232,194,90,.18) inset}
.entry.k-cheatdeath{border-left-color:var(--blood)}
/* near-death is imp1 (a plain line, not a bordered imp2 card) but still
   needs to catch the eye per spec — a left accent without the full card
   treatment keeps it a step below cheat-death/death in weight. */
.entry.imp1.k-neardeath{border-left:2px solid var(--blood); padding-left:9px}
.entry.k-confrontation{border-left-color:var(--blood)}
.entry.k-achievement{border-left-color:var(--gold-lit); color:var(--gold-lit)}
.entry.k-gear-epic{border-left-color:var(--tier-epic); color:var(--tier-epic)}
.entry.k-gear-legendary{border-left-color:var(--tier-legendary); color:var(--tier-legendary)}
/* graves & heirlooms (persistent world) — an elegiac beat gets the same
   blood accent as death/cheat-death (it IS a death, just not this hero's);
   a recovered heirloom is a loot moment, so it reads like k-achievement. */
.entry.k-grave{border-left-color:var(--blood)}
.entry.k-heirloom{border-left-color:var(--gold-lit); color:var(--gold-lit)}

/* buttons + choices */
.btn{display:block; width:100%; font:inherit; font-size:15px; padding:13px; cursor:pointer;
  background:var(--gold); color:#1a1510; border:none; border-radius:8px; font-weight:600;
  letter-spacing:.04em}
.btn.ghost{background:transparent; color:var(--ink-dim); border:1px solid var(--line)}
.btn:disabled{opacity:.4; cursor:default}
.pick{display:block; width:100%; text-align:left; font:inherit; cursor:pointer; margin-bottom:9px;
  background:var(--bg2); color:var(--ink); border:1px solid var(--line); border-radius:9px; padding:13px}
.pick[aria-pressed="true"]{border-color:var(--gold); background:#241f18}
.pick b{display:block; font-family:Cinzel,serif; font-size:15px; color:var(--gold-lit); margin-bottom:3px}
.pick span{display:block; font-size:12.5px; color:var(--ink-dim)}

/* achievement rows — earned mirrors .pick[aria-pressed] (border + background
   tint), the same "this is the chosen/won one" language already used at hero
   creation, so an earned achievement reads as won at a glance rather than
   just carrying different text. Titles get their own class (not .gearslot's
   small uppercase label) since a row here is a title, not a slot name. */
.ach-row{background:var(--bg2); border:1px solid var(--line); border-radius:9px;
  padding:12px 13px; margin-bottom:9px}
.ach-row:last-child{margin-bottom:0}
.ach-row .ach-title{display:block; font-family:Cinzel,serif; font-size:15px;
  margin-bottom:3px; color:var(--head)}
.ach-row.earned{background:#241f18; border-color:var(--gold-lit)}
.ach-row.earned .ach-title{color:var(--gold-lit)}
.ach-check{color:var(--gold-lit)}

.modal{position:fixed; inset:0; background:rgba(8,6,5,.86); display:flex; align-items:center;
  justify-content:center; padding:16px; z-index:50; overflow-y:auto}
.modal .card{max-width:520px; width:100%; margin:auto}

label{display:block; font-size:12.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-dim); margin:14px 0 6px}
input[type=text]{width:100%; font:inherit; font-size:16px; padding:11px; background:var(--bg2);
  color:var(--ink); border:1px solid var(--line); border-radius:8px}
input[type=text]:focus{outline:none; border-color:var(--gold)}

.wywa{border-color:var(--gold)}
.wywa ul{margin:8px 0 0; padding-left:18px; font-size:13.5px}
.wywa li{padding:2px 0}
.wywa-notable{margin-top:10px; padding-top:10px; border-top:1px solid var(--line);
  display:flex; flex-direction:column; gap:6px}
.wn-item{font-size:13px; color:var(--ink-dim); padding-left:11px; position:relative; line-height:1.5;
  overflow-wrap:anywhere}
.wn-item::before{content:""; position:absolute; left:0; top:.55em; width:5px; height:5px;
  border-radius:50%; background:var(--ink-mute)}
.wn-item.k-death::before, .wn-item.k-cheatdeath::before, .wn-item.k-confrontation::before, .wn-item.k-neardeath::before, .wn-item.k-grave::before{background:var(--blood)}
.wn-item.k-ascension::before, .wn-item.k-achievement::before, .wn-item.k-heirloom::before{background:var(--gold-lit)}
.wn-item.k-gear-epic::before{background:var(--tier-epic)}
.wn-item.k-gear-legendary::before{background:var(--tier-legendary)}
.wywa-status{margin:10px 0 0; padding-top:9px; border-top:1px solid var(--line); font-size:13px}
.chipbar{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px}
.chip{font:inherit; font-size:12.5px; padding:8px 13px; cursor:pointer; background:var(--bg2);
  color:var(--ink-dim); border:1px solid var(--line); border-radius:999px; letter-spacing:.02em}
.chip[aria-pressed="true"]{border-color:var(--gold); color:var(--ink); background:#241f18}
/* WYWA's Dismiss control — a real button in the .btn.ghost idiom (not a
   styled hyperlink), with the same touch target every other full-width
   button gets. .dismiss is only ever used here, alongside .btn.ghost, so it
   just adds the spacing this particular placement needs. */
.dismiss{margin-top:10px}
.empty{color:var(--ink-mute); font-size:13.5px; text-align:center; padding:22px 0}

/* restrained motion — respected always; the only things that ever move are a
   fresh WYWA card, the newest chronicle line, and a level-up. Nothing here
   runs on the 250ms live tick. */
@media (prefers-reduced-motion: no-preference){
  .wywa-in{animation:cardIn .5s ease-out}
  /* Chronicle now renders strict newest-first, so the newest entry in the
     newest sitting is the first child, not the last — see chronicleSessions(). */
  .session:first-child > .entry:first-child,
  .session:first-child > .chapter:first-child{animation:entryIn .5s ease-out}
  .heroline.levelup{animation:levelFlash 1.2s ease-out}
  @keyframes cardIn{from{opacity:0; transform:translateY(-6px)} to{opacity:1; transform:none}}
  @keyframes entryIn{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
  @keyframes levelFlash{
    0%{text-shadow:0 0 0 rgba(232,194,90,0)}
    35%{text-shadow:0 0 16px rgba(232,194,90,.85)}
    100%{text-shadow:0 0 0 rgba(232,194,90,0)}
  }
}

/* mobile — Rob reads this on a phone in the morning; single column already,
   this just tightens the tab bar and title so nothing wraps or overflows
   down at 375px. No horizontal scroll anywhere, at any width. */
@media (max-width:400px){
  .wrap{padding:12px 10px 56px}
  .title{font-size:21px; letter-spacing:.14em}
  .tabs{gap:5px}
  .tabs button{font-size:11.5px; padding:13px 2px; letter-spacing:.02em}
  .heroline{font-size:17px}
  .card{padding:12px}
}
html, body{overflow-x:hidden; max-width:100%}
</style>

<div class="wrap">
  <h1 class="title">Go Quest</h1>
  <div class="title-rule"></div>
  <div id="app"></div>
</div>

<script>
"use strict";
/* ============================================================================
   GO QUEST — single-file idle RPG.
   Phase 1 (skeleton) + Phase 2 (offline catch-up + headless harness).

   ARCHITECTURE RULE, load-bearing for everything that comes later:
   the simulation core below (advance / completeTask / levelUp / derived) NEVER
   touches the DOM and never reads wall-clock time. It mutates a state object
   passed to it and takes randomness from a swappable `rng`. That is what makes
   simulate(1000) possible. Later phases (perils, gear, skills, story) must add
   their logic INSIDE that core, not in the render layer.
   ========================================================================= */

/* ---------------------------------- data --------------------------------- */

const SAVE_KEY = "goquest_hero";
const META_KEY = "goquest_meta";
const SAVE_VERSION = 8;
const META_VERSION = 3;

const TASK_DURATION   = 25;      // seconds, before STR reduction
const TRAVEL_SECONDS  = 90;      // zone change
const MERCHANT_SECONDS = 60;     // each leg of a merchant trip (there and back)
const INVENTORY_SLOTS  = 12;
const MAX_OFFLINE_HRS = 48;
const CATCHUP_BATCH   = 200;     // tasks per setTimeout slice
const LOG_ROUTINE_MAX = 300;
const SKILL_LEVELS = [5, 15, 20, 30, 35, 40, 45, 50];   // design doc §8 acquisition levels

// Every number the death curve is sensitive to lives here so the harness can
// sweep them. Change balance HERE, never at the call site.
const BALANCE = {
  regenBase:    0.006,   // fraction of maxHP regenerated per task
  regenConDiv:  60,      // CON's extra multiplier on regen: (1 + min(CON,cap)/div)
  regenConCap:  60,      // ...CON above this stops helping. The cap is the point.
  gearBudget:   0.18,    // stat points per point of itemScore
  merchantHeal: 1.00,    // fraction of maxHP restored by a merchant trip
  perilDmgMult: 3.00,    // global scalar on the zone damage ranges
  perilChanceMult: 1.00, // global scalar on the zone peril frequencies
  xpCurveMult:  1.45,    // scalar on xpToNext — the arc-length knob
  evasionCap:   0.50,    // DEX stops buying evasion here. Raising it is what
                         // gives the DEX classes defensive scaling at all —
                         // past the cap, DEX is a dead stat defensively.
  dmgHpBlend:   0.35,    // 1 = damage is % of the hero's OWN maxHP (design doc
                         // as written); 0 = % of a level-referenced HP pool.
                         // See the note below — this one is a design decision.
  skillMitigationCap: 0.60, // stacked mitigation skills can't reduce peril dmg past this
  skillTaskSpeedFloor: 0.50,// stacked task-speed skills can't cut task time past this fraction
  skillBuyMultFloor:   0.40,// stacked buy-discount skills can't cut merchant prices past this

  // --- Gold economy (design doc §9 merchant trips). Zone `gold` income climbs
  // ~40x zone1->zone6 while itemScore (and so unadjusted price) only climbed
  // ~3-4x, so prices fell further and further behind income the deeper a hero
  // got — by zone 4 one merchant cycle's income was 7.6x the cost of a full
  // re-kit. See doMerchantTrip() for how these combine. ---
  buyPriceMult:  6,     // base merchant buy price per point of itemScore (was a bare literal)
  sellPriceMult: 2,     // base sell value per point of itemScore (was a bare literal)
  priceZoneExp:  1.00,  // curve exponent on (zone.gold / ZONES[0].gold) — re-anchors price to
                        // the SAME curve income already climbs, so gold becomes a real
                        // constraint deep in the run without turning it into a wall.
                        // Measured at 1.0: spend-per-cycle rises from ~11% of income (zone 1,
                        // unchanged — it's the reference zone) to ~31-39% of income (zones 3-6),
                        // up from ~10-15% before this change, with zero heroes stranded unable
                        // to afford the L48+ relic guarantee.
  merchantMaxBuys: 4,   // cap on upgrade purchases per merchant trip — the merchant now keeps
                        // buying weakest-slot upgrades while they're affordable and genuine,
                        // but a rich hero re-kits, not re-kits forever
  commissionPriceMult: 5.0, // premium over an ordinary purchase for guaranteeing a specific
                            // slot's tier instead of hoping stock rolls well
  commissionTier: "epic",   // Guaranteed floor tier a commission buys, and the single most
                            // important number in the economy. Repricing alone did NOT make
                            // gold scarce (surplus at death actually ROSE to 258k): the
                            // merchant's real bottleneck was never price, it was that rolled
                            // stock rarely beats gear a hero already owns after 200+ drops.
                            // Only quality the hero cannot get from drops absorbs the surplus —
                            // at "epic" it falls to ~75k. Note the curve is not monotonic:
                            // "legendary" at 14x leaves MORE gold than "epic" at 5x, because
                            // a price that steep means the hero commissions far less often.
                            // Commissioning still cannot satisfy the ascension gate — the
                            // relic slot is skipped while that guarantee is pending.

  // --- Phase 6: the final confrontation. New knobs, none of the above
  // touched — the lead tunes these independently of the regular death curve. ---
  // Tuned so the confrontation culls level-50 heroes from ~12.8% reaching the
  // gate to ~6.7% ascending — the middle of the design doc's 5-10% target.
  confrontPerilChance: 0.50,   // per-step peril chance during the confrontation (zone6 is 12%)
  confrontDmgMin: 0.60,        // min fraction of the blended HP pool (refHP/maxHP) per hit
  confrontDmgMax: 0.90,        // max fraction of the blended HP pool per hit
  confrontRegenMult: 0.30,     // partial regen between confrontation steps — no merchant heal mid-fight
  confrontRelicLegendaryChance: 0.15, // odds the guaranteed L48+ relic rolls legendary instead of epic
};
/* Why peril damage references a level-typical HP pool instead of the hero's own:
   The doc (§7) makes damage a percentage of maxHP so the danger curve stays
   stable as HP scales. It does — but it also means a hero's own maxHP is
   worthless defensively, since bigger pool and bigger hits cancel exactly. That
   silently deletes Constitution as a survival stat, and with it the doc's
   central tension (§4). Measured with pure %maxHP: Apprentices out-survived
   Soldiers 59% to 29% — INT was strictly dominant, being both faster per level
   (fewer tasks) and no more dangerous.
   Referencing a level-typical pool keeps the curve indexed on one number per
   zone (the doc's actual goal) while making CON's extra HP genuinely absorb
   hits. INT still races; CON now actually survives. */
function refHP(level){ return 114 + 14.4 * level; }
/* Why the CON regen term is CAPPED rather than raw or removed:
   maxHP already contains CON*8, and peril damage is a percentage of maxHP, so
   an uncapped (1 + CON/40) makes regen scale with CON^2 while incoming damage
   scales linearly. Gear pushed CON to ~206 and regen to 89 HP/task against 28
   of damage — nothing could die.
   But removing the term entirely goes too far the other way: when damage AND
   regen are both percentages of maxHP, extra maxHP buys nothing and CON becomes
   mechanically inert. Measured: Apprentices then out-survived Soldiers 49 to 14,
   inverting the design doc's central tension (§4).
   Capping keeps CON a real survivability stat over its natural range while
   denying gear the runaway. Protect this relationship during future tuning. */

const STAT_KEYS = ["str","dex","con","int","wis","cha"];
const STAT_NAME = {str:"Strength",dex:"Dexterity",con:"Constitution",
                   int:"Intelligence",wis:"Wisdom",cha:"Charisma"};

const RACES = {
  human:    {name:"Human",    mods:{str:1,dex:1,con:1,int:1,wis:1,cha:1},
             trait:"Ambitious", traitText:"+5% experience", xpMult:1.05, starter:true},
  dwarf:    {name:"Dwarf",    mods:{con:4,str:2,dex:-2},
             trait:"Stoneblood", traitText:"+10% regeneration", regenMult:1.10, starter:true},
  elf:      {name:"Elf",      mods:{dex:4,int:3,con:-3},
             trait:"Keen Sight", traitText:"+3% evasion", evasionBonus:0.03, starter:true},
  halfling: {name:"Halfling", mods:{cha:3,dex:3,str:-2},
             trait:"Lucky", traitText:"+4% gear drop chance", dropBonus:0.04},
  orc:      {name:"Orc",      mods:{str:5,con:3,int:-3,cha:-2},
             trait:"Brutal", traitText:"+8% combat task speed", taskSpeedMult:0.92},
  tiefling: {name:"Tiefling", mods:{int:4,cha:3,wis:-2},
             trait:"Infernal Pact", traitText:"one extra cheat-death charge", bonusCheatDeath:1},
};

// Stat weighting decides how the +3 points per level are distributed.
// Tier 2 classes (Phase 5) fork four ways off each tier 1 at L25 (design doc
// §6) and each carries a `passive` — a SKILLS key granted automatically on
// advancement, not offered as a choice. Exact weighting numbers are a tuning
// pass per the doc, not a design decision; the shape (what each class leans
// into) is what matters here.
const CLASSES = {
  novice:     {name:"Novice", tier:0,
               weights:{str:.5,dex:.5,con:.5,int:.5,wis:.5,cha:.5},
               blurb:"Untested. Everything still ahead."},
  soldier:    {name:"Soldier", tier:1,
               weights:{str:1.2,dex:.4,con:1.0,int:.1,wis:.2,cha:.1},
               blurb:"Slow, heavy, hard to kill. The long road to ascension."},
  scout:      {name:"Scout", tier:1,
               weights:{str:.5,dex:1.3,con:.5,int:.3,wis:.3,cha:.1},
               blurb:"Evasive and quick. Takes only the hits worth taking."},
  apprentice: {name:"Apprentice", tier:1,
               weights:{str:.1,dex:.4,con:.4,int:1.4,wis:.6,cha:.1},
               blurb:"Levels fastest, dies deepest. Arrives at danger early."},

  // --- Soldier's four (§6) ---
  knight:      {name:"Knight", tier:2,
                weights:{str:1.0,dex:.3,con:1.3,int:.1,wis:.5,cha:.3},
                blurb:"Iron discipline. Doesn't fall so much as refuse to.",
                passive:"bulwark_stance"},
  berserker:   {name:"Berserker", tier:2,

// Phase 6 (design doc §12). Two layers: five acts tied to level (fixed
// structure), and a per-run thread rolled at hero creation (randomized
// dressing). Beats fire on LEVEL THRESHOLDS inside the simulation core
// (levelUp/createState), never from the render layer, so simulate(n) sees
// the exact same story a real playthrough does.

const ACTS = [
  {n:1, name:"The Calling",        lo:1,  hi:9},
  {n:2, name:"The Gathering Dark", lo:10, hi:18},
  {n:3, name:"The Deepening",      lo:19, hi:28},
  {n:4, name:"The Reckoning",      lo:29, hi:36},
  {n:5, name:"The Riven Crown",    lo:37, hi:50},
];
function actForLevel(level){
  for (const a of ACTS) if (level <= a.hi) return a;
  return ACTS[ACTS.length-1];
}

// Substitutes {name}/{antagonist}/{goal}/{doom}/{sign}/... into a template.
// Unknown {tokens} are left untouched rather than erased, so a typo in a
// template shows up as a visible bug instead of a silent blank.
function fillTemplate(str, vars){
  return str.replace(/\{(\w+)\}/g, (m, k) => (k in vars) ? vars[k] : m);
}
function threadVars(S, extra){
  const t = (S.world && S.world.thread) || {};
  return Object.assign({name: S.hero.name, antagonist: t.antagonist,
                        goal: t.goal, doom: t.doom}, extra || {});
}

const ANTAGONIST_TYPE_KEYS = Object.keys(ANTAGONIST_TYPES);

function rollAntagonistName(type){
  const t = ANTAGONIST_TYPES[type];
  const f = t.firsts ? pick(t.firsts) : null;
  const e = pick(t.epithets);
  return t.nameFmt(f, e);
}
function rollThread(){
  const type = pick(ANTAGONIST_TYPE_KEYS);
  const t = ANTAGONIST_TYPES[type];
  return {antagonist: rollAntagonistName(type), antagonistType: type,
          goal: pick(t.goals), doom: pick(t.dooms)};
}

/* ------------------------------ shared helpers ----------------------------- */

// A peril-shaped HP delta (same percentage-of-a-level-typical-pool math as
// rollPeril/refHP) that can never itself cause DEAD — a dilemma or a scripted
// story beat shouldn't end the chronicle on a screen the player didn't see
// coming as danger. Floors at 1 HP and fires the same near-death crossing log
// line rollPeril() does, so a dilemma that hurts reads exactly like a peril
// that hurts everywhere else in the chronicle.
function applyHpFrac(S, frac){
  const h = S.hero, d = derived(h, S.gear);
  const wasSafe = h.hp / d.maxHP >= 0.20;
  const delta = Math.round(d.maxHP * frac);
  h.hp = Math.max(1, Math.min(d.maxHP, h.hp + delta));
  if (wasSafe && h.hp / d.maxHP < 0.20)
    logEvent(S, "neardeath", `${h.name} is barely standing. HP critical.`, 1);
  return delta;
}
// A lingering scar (or, sometimes, a callus) — a small PERMANENT shift to a
// base stat, same category of write as allocateStats()/race mods, not a
// derived()-layer effect. Floored at 1 so a bad roll can't zero a stat out.
function applyStatScar(S, stat, amount){
  S.hero.stats[stat] = Math.max(1, S.hero.stats[stat] + amount);
}
// A temporary boon that decays by TASKS COMPLETED, not clock time, so it
// means the same thing whether the hero is played live or caught up offline
// in one burst. Folded into effStats()/derived() via boonAgg() below, same
// effect-kind vocabulary SKILLS already uses. Decremented in decayBoons(),
// called once per completed task (see completeTask()).
function grantBoon(S, key, tasks, effect){
  S.hero.boons = S.hero.boons || [];
  S.hero.boons.push({key, tasksLeft: tasks, effect});
}
function decayBoons(S){
  const h = S.hero;
  if (!h.boons || !h.boons.length) return;
  h.boons = h.boons.filter(b => --b.tasksLeft > 0);
}
// Aggregates hero.boons the same way skillAgg() aggregates hero.skills.
// Kept as a separate small object (rather than folded into skillAgg itself)
// because boons are transient game-state, not permanent character build —
// keeping the two aggregations separate means a boon can never accidentally
// leak into anything that reads hero.skills directly.
function boonAgg(hero){
  const agg = {stat:{}, xpMult:1, goldMult:1, taskSpeedMult:1, mitigation:0, evasion:0};
  for (const k of STAT_KEYS) agg.stat[k] = 0;
  for (const b of (hero.boons || [])){
    const e = b.effect;
    if (!e) continue;
    switch (e.kind){
      case "stat": agg.stat[e.stat] += e.amount; break;
      case "mult":
        if (e.target === "xp") agg.xpMult += e.amount;
        else if (e.target === "gold") agg.goldMult += e.amount;
        break;
      case "mitigation": agg.mitigation += e.amount; break;
      case "evasion": agg.evasion += e.amount; break;
      case "taskSpeed": agg.taskSpeedMult -= e.amount; break;
    }
  }
  agg.taskSpeedMult = Math.max(BALANCE.skillTaskSpeedFloor, agg.taskSpeedMult);
  return agg;
}

function beginDilemma(S, key){
  const dil = DILEMMAS[key];
  const variantIdx = randInt(0, dil.variants.length - 1);
  S.world.pendingChoice = {kind:"dilemma", dilemmaKey:key, variantIdx,
                            options: Object.keys(dil.options)};
  S.world.state = "AWAITING_CHOICE";
  logEvent(S, "dilemma", fillTemplate(dil.variants[variantIdx], threadVars(S)), 2);
}

// References a dilemma flag if one is available, so the encounter (and by
// extension the run) reads as continuous with choices made earlier — the
// entire point of threading flags through S.world in the first place.
function act4FlagLine(S){
  const f = S.world.flags || {};
  const h = S.hero;
  if (f.rival === "carried")
    return ` The message ${h.name} has been carrying doesn't survive the encounter — whatever it said, it's ash now, same as everything else here.`;
  if (f.shortcut === "took")
    return ` Something about the encounter feels familiar in a way ${h.name} can't place — the same shape as a name once traded away in the dark, maybe, if there were still a name left to compare it to.`;
  if (f.village === "helped")
    return ` ${h.name} thinks, in the middle of it, of a village that's rebuilding a little because someone once stopped to help. It isn't much of a shield. It's something.`;
  return "";
}

function triggerAct4Failure(S){
  const h = S.hero, w = S.world;
  w.act4FailureDone = true;
  const type = w.thread.antagonistType;
  const base = fillTemplate(pick(ACT4_FAILURE[type]), threadVars(S));

  // Cost 1: always a heavy, survivable HP toll (never lethal — see applyHpFrac).
  applyHpFrac(S, -(0.45 + rng() * 0.20));

  // Cost 2: the harshest thing actually available, in priority order — a
  // charge held in reserve, then equipped gear, then (only if truly nothing
  // else is left) a flag's payoff taken back.
  let costLine;
  if (h.skillCheatDeathQueue && h.skillCheatDeathQueue.length){
    h.skillCheatDeathQueue.pop();
    costLine = ` Whatever was holding a line open for ${h.name} in reserve is gone now — spent just staying alive.`;
  } else if (h.cheatDeathCharges > 0){
    h.cheatDeathCharges--;
    costLine = ` A ward ${h.name} was carrying breaks keeping this from being the last page of the chronicle.`;
  } else {
    const equippedSlots = SLOT_KEYS.filter(s => S.gear[s]);
    if (equippedSlots.length){
      const slot = pick(equippedSlots);
      const lost = S.gear[slot];
      S.gear[slot] = null;
      // cap() because costLine is appended after a sentence-ending period and
      // itemPhrase() returns a lowercase article ("a Silvered Maul ...").
      costLine = ` ${cap(itemPhrase(lost))} doesn't survive it — ${h.name} does, barely, and without it.`;
    } else if (S.world.flags.rival === "carried"){
      S.world.flags.rival = "lost";
      costLine = ` Whatever ${h.name} was carrying for someone else doesn't make it through — lost, the same as everything else here.`;
    } else {
      costLine = ` ${h.name} has nothing left to lose but time, and loses some of that too.`;
    }
  }

  logEvent(S, "antagonist", `${base}${costLine}${act4FlagLine(S)}`, 2);
}

// Extra sentence appended to the death/ascension epilogue when a dilemma flag
// is available to pay off — the concrete demonstration that a choice made
// hours (or acts) earlier still means something at the very end. Priority
// order favors the most recently-set, most story-relevant flag.
function flagEpitaph(S, outcome){
  const f = S.world.flags || {};
  const h = S.hero;
  if (f.edge === "accepted")
    return outcome === "ascension"
      ? ` Whatever ${h.name} took on that last stretch of road went into this. It isn't easy to look at directly, even now.`
      : ` Whatever ${h.name} took on that last stretch of road didn't turn out to be enough, in the end. It rarely is.`;
  if (f.edge === "refused")
    return outcome === "ascension"
      ? ` ${h.name} did this with nothing but what was already earned. That much, at least, is worth saying plainly.`
      : ` ${h.name} refused the easy edge, at the end, and paid the harder price instead. That was always going to be true either way.`;
  if (f.wastes === "helped")
    return ` Somewhere behind ${h.name}, in the Ashen Wastes, someone is still walking because ${h.name} stopped once. That doesn't end the story. It's still true.`;
  if (f.village === "helped")
    return ` A village ${h.name} once stopped to help is still standing, mostly — more than it would have said for itself the day ${h.name} found it.`;
  return "";
}

/* ------------------------------- randomness ------------------------------ */
// Swappable so the harness can run seeded and reproducible.
let rng = Math.random;
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const pick = arr => arr[Math.floor(rng() * arr.length)];
const randInt = (lo, hi) => lo + Math.floor(rng() * (hi - lo + 1));
function shuffle(arr){
  for (let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(rng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Populated by unlockAchievement(), drained the next time a render surfaces
// it (renderMain/renderCreation). Purely a UI convenience, never persisted.
let justUnlocked = [];

function unlockAchievement(meta, key, S){
  if (!meta) return;                      // no real player context — simulate(n), always
  meta.achievements = meta.achievements || [];
  if (meta.achievements.includes(key)) return;
  const a = ACHIEVEMENTS[key];
  if (!a) return;
  meta.achievements.push(key);
  meta.unlocks = meta.unlocks || {};
  a.apply(meta);
  justUnlocked.push(key);
  if (S) logEvent(S, "achievement", `Achievement unlocked — ${a.name}. ${a.reward}`, 2);
  saveMeta();
}

// Attaches a live meta reference to a hero state, non-enumerably so
// JSON.stringify(S) (saveGame) never serializes it into goquest_hero — the
// two saves stay deliberately separate (CLAUDE.md "Save"). Re-attached on
// every load, since JSON.parse can't round-trip a property descriptor.
function attachMeta(s, meta){
  Object.defineProperty(s, "_meta", {value: meta || null, writable: true, configurable: true, enumerable: false});
  return s;
}

// Die-in-each-zone bookkeeping, called at the moment DEAD is set (both the
// ordinary rollPeril() death and the rollConfrontationPeril() death — the
// confrontation only ever happens in zone 6, but routing both through one
// function keeps the bookkeeping in one place).
// Called when a hero's run ends by any route — death, ascension, retirement —
// so the lifetime task tally survives the per-hero stats.tasksCompleted reset.
function onHeroRunEnd(S){
  const meta = S._meta;
  if (!meta) return;
  meta.lifetimeTasks = (meta.lifetimeTasks || 0) + (S.stats.tasksCompleted || 0);
  if (meta.lifetimeTasks >= 25000) unlockAchievement(meta, "longRecord", S);
}
// Kept under the old name so the existing death call sites don't have to move.
function onHeroDeath(S){ onHeroRunEnd(S); }

// Full-rare-set bookkeeping, called at the end of equipItem() so every path
// that can complete the set (task drop, merchant buy, starting relic) is covered.
function checkFullRareSet(S){
  const meta = S._meta;
  if (!meta) return;
  for (const slot of SLOT_KEYS){
    const it = S.gear[slot];
    if (!it || (it.tier !== "rare" && it.tier !== "epic" && it.tier !== "legendary")) return;
  }
  unlockAchievement(meta, "fullRareSet", S);
}
