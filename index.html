  rare:      ["the Drowned","the Barrow","the Black Cistern","Old Names","the Cinder Stair","the Wight"],
  epic:      ["the Unmourned","the Riven Sky","the Last Page","the Crowned Thing","the Siege","the Ashfall"],
  legendary: ["the Sundered Gate","the World's End","the Unmaking","the Last Seal","the Doom That Waits","the Riven Crown"],
};

/* ------------------------------- randomness ------------------------------ */
// Swappable so the harness can run seeded and reproducible.
let rng = Math.random;
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const pick = arr => arr[Math.floor(rng() * arr.length)];
const randInt = (lo, hi) => lo + Math.floor(rng() * (hi - lo + 1));
function shuffle(arr){
  for (let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(rng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* --------------------------- meta-progression ----------------------------- */
// Phase 7 (design doc §11). Achievements are LIFETIME — they live in
// goquest_meta, never wiped with a hero, and rewards are unlocking rather
// than numeric (the doc's explicit warning: hero #40 must not be meaningfully
// stronger than hero #2, or daily variance flattens). The three numeric perks
// below (start gold, drop chance, inventory slot) are the deliberate
// exceptions called out in the brief — nothing else should add more.
//
// META isn't threaded through the simulation core as a parameter (advance/
// levelUp/etc. only take S), so achievement bookkeeping instead reads/writes
// through S._meta — a reference attached with attachMeta(), NOT persisted
// with the hero save (non-enumerable, so JSON.stringify(S) skips it). It is
// null whenever there's no real player meta to write to, which includes
// EVERY simulate(n) run (simulateOne() always calls createState(..., null)) —
// so unlockAchievement() must no-op cleanly on a null meta, and does. None of
// the functions below call rng()/pick() unless meta is truthy, so a null meta
// (the harness) consumes zero extra randomness and the seeded stream — and
// therefore the tuned balance numbers — are unaffected.
const ACHIEVEMENTS = {
  actII: {
    name: "Into the Gathering Dark",
    desc: "Reach Act II — the antagonist's work is first witnessed.",
    reward: "Unlocks the Halfling as a playable race.",
    apply: meta => { meta.unlocks.halfling = true; },
  },
  actIII: {
    name: "The Deepening",
    desc: "Reach Act III — learn the true scale of the threat.",
    reward: "Unlocks the Orc as a playable race.",
    apply: meta => { meta.unlocks.orc = true; },
  },
  level40: {
    name: "Hardened",
    desc: "Reach level 40 with any hero.",
    reward: "Unlocks the Tiefling as a playable race.",
    apply: meta => { meta.unlocks.tiefling = true; },
  },
  allZoneDeaths: {
    name: "Six Graves",
    desc: "Have a hero die in each of the six zones, across all your heroes.",
    reward: "Unlocks the Ancient name pool at hero creation.",
    apply: meta => { meta.unlocks.ancientNames = true; },
  },
  fullRareSet: {
    name: "Well Appointed",
    desc: "Equip Rare-or-better gear in all six slots at once.",
    reward: "New heroes start with 100 gold.",
    apply: meta => { meta.unlocks.startGold = 100; },
  },
  legendaryFound: {
    name: "Something Rarer",
    desc: "Find a Legendary item.",
    reward: "+2% gear drop chance, permanently, for every future hero.",
    apply: meta => { meta.unlocks.dropBonus = (meta.unlocks.dropBonus || 0) + 0.02; },
  },
  allAdvancedClasses: {
    name: "Every Path Walked",
    desc: "Reach all 12 advanced classes, across all your heroes.",
    reward: "Unlocks the Titles name pool at hero creation.",
    apply: meta => { meta.unlocks.titleNames = true; },
  },
  ascendOnce: {
    name: "Ascendant",
    desc: "Survive the final confrontation and ascend.",
    reward: "New heroes start equipped with an Uncommon relic.",
    apply: meta => { meta.unlocks.startRelic = "uncommon"; },
  },
  ascendThrice: {
    name: "Thrice Proven",
    desc: "Ascend three times.",
    reward: "Unlocks Zone 7 (in development).",
    apply: meta => { meta.unlocks.zone7 = true; },
  },
  tenHeroesRest: {
    name: "A Long List of Names",
    desc: "Lay 10 heroes to rest.",
    reward: "+1 inventory slot, permanently.",
    apply: meta => { meta.unlocks.invSlotBonus = (meta.unlocks.invSlotBonus || 0) + 1; },
  },
};
const ACHIEVEMENT_KEYS = Object.keys(ACHIEVEMENTS);

// Populated by unlockAchievement(), drained the next time a render surfaces
// it (renderMain/renderCreation). Purely a UI convenience, never persisted.
let justUnlocked = [];

function unlockAchievement(meta, key, S){
  if (!meta) return;                      // no real player context — simulate(n), always
  meta.achievements = meta.achievements || [];
  if (meta.achievements.includes(key)) return;
  const a = ACHIEVEMENTS[key];
  if (!a) return;
  meta.achievements.push(key);
  meta.unlocks = meta.unlocks || {};
  a.apply(meta);
  justUnlocked.push(key);
  if (S) logEvent(S, "achievement", `Achievement unlocked — ${a.name}. ${a.reward}`, 2);
  saveMeta();
}

// Attaches a live meta reference to a hero state, non-enumerably so
// JSON.stringify(S) (saveGame) never serializes it into goquest_hero — the
// two saves stay deliberately separate (CLAUDE.md "Save"). Re-attached on
// every load, since JSON.parse can't round-trip a property descriptor.
function attachMeta(s, meta){
  Object.defineProperty(s, "_meta", {value: meta || null, writable: true, configurable: true, enumerable: false});
  return s;
}

// Die-in-each-zone bookkeeping, called at the moment DEAD is set (both the
// ordinary rollPeril() death and the rollConfrontationPeril() death — the
// confrontation only ever happens in zone 6, but routing both through one
// function keeps the bookkeeping in one place).
function onHeroDeath(S){
  const meta = S._meta;
  if (!meta) return;
  meta.deathZones = meta.deathZones || [];
  const zn = S.world.zone;
  if (!meta.deathZones.includes(zn)) meta.deathZones.push(zn);
  if (meta.deathZones.length >= 6) unlockAchievement(meta, "allZoneDeaths", S);
}

// Full-rare-set bookkeeping, called at the end of equipItem() so every path
// that can complete the set (task drop, merchant buy, starting relic) is covered.
function checkFullRareSet(S){
  const meta = S._meta;
  if (!meta) return;
  for (const slot of SLOT_KEYS){
    const it = S.gear[slot];
    if (!it || (it.tier !== "rare" && it.tier !== "epic" && it.tier !== "legendary")) return;
  }
  unlockAchievement(meta, "fullRareSet", S);
}

// Effective inventory capacity — base + the tenHeroesRest achievement's
// permanent bonus, baked into the hero at creation (see createState).
function invSlots(S){ return INVENTORY_SLOTS + (S.hero.metaInvBonus || 0); }

// Cap on goquest_meta's hall so localStorage can't grow without bound over a
// player's lifetime of heroes.
const HALL_MAX = 100;
function trimHall(meta){
  if (meta.hall.length > HALL_MAX) meta.hall = meta.hall.slice(-HALL_MAX);
}

// Name generation. Base pool is always available; Ancient and Titles are
// achievement-gated (see ACHIEVEMENTS above) and feed into the same roll
// rather than replacing it, so an unlocked pool WIDENS the draw instead of
// being a separate mode to pick.
const NAME_FIRST = [
  "Corin","Wren","Halsin","Ada","Merrick","Sable","Torvin","Isolde","Bram","Nessa",
  "Dorn","Ysolde","Kade","Rhian","Osgar","Talia","Brant","Maren","Coel","Ysbel",
  "Garrick","Sela","Wulfric","Aine","Dresden","Petra","Aldous","Nyla","Barrow","Edda",
];
const NAME_ANCIENT = [
  "Wystan","Erendil","Yorick","Osric","Brannor","Tamsin","Uwaine","Godfrey",
  "Aelric","Maud","Cadmus","Ealdred","Sigrun","Baldric","Wyndham","Aethel",
];
const NAME_TITLES = [
  "the Unbroken","Stonefast","the Wanderer","Ashwalker","the Grey","Ironhand",
  "the Quiet","Longstride","the Steady","Cinderborn","the Watchful","Roadworn",
  "the Last","Emberkin","the Patient","Graveward",
];
function rollHeroName(meta){
  const pool = NAME_FIRST.slice();
  if (meta && meta.unlocks && meta.unlocks.ancientNames) pool.push(...NAME_ANCIENT);
  let name = pick(pool);
  if (meta && meta.unlocks && meta.unlocks.titleNames && rng() < 0.5) name += " " + pick(NAME_TITLES);
  return name;
}

/* ------------------------------ state factory ---------------------------- */

function createState(name, raceKey, meta){
  const race = RACES[raceKey];
  const stats = {};
  for (const k of STAT_KEYS) stats[k] = 8 + (race.mods[k] || 0);
  const statFrac = {}; for (const k of STAT_KEYS) statFrac[k] = 0;

  const S = {
    version: SAVE_VERSION,
    hero: {
      name, race: raceKey, cls: "novice", classPath: ["novice"],
      level: 1, xp: 0, hp: 0, stats, statFrac,
      gold: (meta && meta.unlocks && meta.unlocks.startGold) || 0,
      skills: [], cheatDeathCharges: race.bonusCheatDeath || 0,
      skillCheatDeathQueue: [], skillState: {},
      // Phase 7 — meta-progression unlocks baked in ONCE at creation (not
      // read continuously from META during play, which isn't threaded
      // through the simulation core). See ACHIEVEMENTS' apply() functions.
      metaDropBonus: (meta && meta.unlocks && meta.unlocks.dropBonus) || 0,
      metaInvBonus: (meta && meta.unlocks && meta.unlocks.invSlotBonus) || 0,
    },
    world: {
      zone: 1, state: "QUESTING", taskProgressMs: 0, taskName: "",
      travelMsLeft: 0, travelKind: null,   // 'zone' | 'merchant_out' | 'merchant_return'
      act: 1, thread: null,
      pendingChoice: null,   // {kind:'class', options:[...]}
      bankedMs: 0,           // unspent offline time held across a blocking choice
      clock: Date.now(),     // SIMULATED time — what the chronicle is stamped with
      killedBy: null,        // peril incident text that ended the run, for the death screen
      epilogueIdx: null,     // which EPILOGUES template, chosen once at death so it's stable on reload
      // Phase 6 — story/ascension.
      confrontation: null,        // {step} while state === "CONFRONTATION"
      diedInConfrontation: false, // distinguishes a confrontation death from an ordinary zone6 death
      ascendedAt: null,           // simulated clock time of ascension, for the epilogue's "time lived"
      ascensionEpilogueIdx: null, // which ASCENSION_EPILOGUES template, stable on reload
    },
    gear: {weapon:null, armor:null, helm:null, gloves:null, boots:null, relic:null},
    inventory: [],
    log: [],
    // birthTime is stamped from the SIMULATED clock, because deathTime is too.
    // Subtracting a simulated timestamp from a wall-clock one produced a
    // negative lifespan on the death screen.
    stats: {tasksCompleted:0, birthTime:null, deathTime:null,
            goldEarned:0, itemsFound:0, perilsSurvived:0, merchantTrips:0},
    lastTick: Date.now(),
  };
  attachMeta(S, meta || null);
  // Ascend-once reward: a starting relic, equipped BEFORE hp is computed so
  // its stat bonuses (esp. CON) count toward the hero's opening maxHP. Only
  // runs when a real meta grants it — never during simulate(n) (meta null).
  if (meta && meta.unlocks && meta.unlocks.startRelic){
    const relic = generateItem(1, "relic", false, 0, meta.unlocks.startRelic);
    equipItem(S, relic);
  }
  S.stats.birthTime = S.world.clock;
  S.hero.hp = derived(S.hero, S.gear).maxHP;
  S.world.taskName = pick(TASKS[1]);
  // Roll the per-run story thread (design doc §12) and open the chronicle.
  // Done here, inside the pure state factory, so simulate(n) gets the exact
  // same opening beat a real playthrough would — not something bolted on in
  // the render layer.
  S.world.thread = rollThread();
  logEvent(S, "birth", `${S.hero.name} takes up the road.`, 2);
  if (S.gear.relic) logEvent(S, "gear", `${S.hero.name} sets out already carrying ${itemPhrase(S.gear.relic)}.`, 1);
  logEvent(S, "story", fillTemplate(pick(ACT_MAJOR[1][S.world.thread.antagonistType]), threadVars(S)), 2);
  return S;
}

/* -------------------------- derived stats (one place) -------------------- */
// Gear (and, later, skill) bonuses are folded in HERE so every consumer
// inherits them automatically. Nothing downstream should read hero.stats
// directly — always go through derived()/effStats().

// Aggregates every non-event skill effect a hero currently owns (signature
// passives included — they're stored in hero.skills exactly like picks) into
// one small object. "triggered" and "cheatdeath" are event-driven, not
// aggregated stats, so they're handled at the point they fire instead (see
// checkTriggers() and the cheat-death branch in rollPeril()).
function skillAgg(hero){
  const agg = {stat:{}, xpMult:1, goldMult:1, taskSpeedMult:1, mitigation:0,
               evasion:0, sellMult:1, buyMult:1, dropTierBump:0};
  for (const k of STAT_KEYS) agg.stat[k] = 0;
  for (const key of hero.skills){
    const sk = SKILLS[key];
    if (!sk) continue;
    const e = sk.effect;
    switch (e.kind){
      case "stat": agg.stat[e.stat] += e.amount; break;
      case "mult":
        if (e.target === "xp") agg.xpMult += e.amount;
        else if (e.target === "gold") agg.goldMult += e.amount;
        break;
      case "taskSpeed": agg.taskSpeedMult -= e.amount; break;
      case "mitigation": agg.mitigation += e.amount; break;
      // Evasion is the DEX classes' answer to soak. It stacks on TOP of the
      // DEX-derived evasion cap deliberately — capping it again would recreate
      // exactly the dead-stat problem that made Assassin unplayable.
      case "evasion": agg.evasion += e.amount; break;
      case "economy":
        if (e.target === "sell") agg.sellMult += e.amount;
        else if (e.target === "buy") agg.buyMult -= e.amount;
        break;
      case "dropQuality": agg.dropTierBump += e.amount; break;
    }
  }
  // Safety clamps (BALANCE-tunable): a handful of skill gates should never
  // let one system fully trivialize itself no matter how many stack onto
  // the same lever.
  agg.taskSpeedMult = Math.max(BALANCE.skillTaskSpeedFloor, agg.taskSpeedMult);
  agg.mitigation = Math.min(BALANCE.skillMitigationCap, agg.mitigation);
  agg.buyMult = Math.max(BALANCE.skillBuyMultFloor, agg.buyMult);
  return agg;
}

function effStats(hero, gear){
  const out = {};
  for (const k of STAT_KEYS) out[k] = hero.stats[k];
  if (gear) for (const slot of SLOT_KEYS){
    const item = gear[slot];
    if (item) for (const k in item.stats) out[k] += item.stats[k];
  }
  const agg = skillAgg(hero);
  for (const k of STAT_KEYS) out[k] += agg.stat[k];
  return out;
}

function derived(hero, gear){
  const st = effStats(hero, gear);
  const race = RACES[hero.race];
  const agg = skillAgg(hero);
  const maxHP = 50 + st.con * 8 + hero.level * 10;
  return {
    stats: st,
    maxHP,
    taskMs: TASK_DURATION * 1000
            * Math.max(0.65, 1 - st.str * 0.004)
            * (race.taskSpeedMult || 1)
            * agg.taskSpeedMult,
    xpMult:   (1 + st.int * 0.012) * (race.xpMult || 1) * agg.xpMult,
    goldMult: (1 + st.cha * 0.010) * agg.goldMult,
    evasion:  Math.min(BALANCE.evasionCap, st.dex * 0.008)
              + (race.evasionBonus || 0) + agg.evasion,
    perilMult: Math.max(0.70, 1 - st.wis * 0.006),
    regenPerTask: maxHP * BALANCE.regenBase
                  * (1 + Math.min(st.con, BALANCE.regenConCap) / BALANCE.regenConDiv)
                  * (race.regenMult || 1),
    dropChance: 0.12 + (race.dropBonus || 0) + (hero.metaDropBonus || 0),
    mitigation: agg.mitigation,
    sellMult: agg.sellMult,
    buyMult: agg.buyMult,
    dropTierBump: agg.dropTierBump,
  };
}

/* --------------------------------- log ----------------------------------- */
// importance: 0 routine (pruned) · 1 notable (kept) · 2 story beat (kept, framed)

function logEvent(S, type, text, imp){
  // Stamped with the SIMULATED clock, not the wall clock. Eight hours of
  // offline catch-up must read as eight hours in the chronicle, not as one
  // minute at boot time.
  S.log.push({t: S.world.clock || Date.now(), type, text, imp: imp || 0});
  if (S.log.length > LOG_ROUTINE_MAX + 400) pruneLog(S);
}
function pruneLog(S){
  const kept = [];
  let routine = 0;
  for (let i = S.log.length - 1; i >= 0; i--){
    const e = S.log[i];
    if (e.imp > 0) { kept.push(e); continue; }
    if (routine < LOG_ROUTINE_MAX) { kept.push(e); routine++; }
  }
  kept.reverse();
  S.log = kept;
}

/* ============================ SIMULATION CORE ============================= */
/* No DOM. No Date.now() for pacing. Pure with respect to (state, rng).       */

function allocateStats(S){
  // +3 points per level, distributed by class weighting. Fractional carry
  // keeps the long-run split exact and stays deterministic (no rng), so two
  // heroes of the same class and level always have the same statline.
  const h = S.hero;
  const w = CLASSES[h.cls].weights;
  const total = STAT_KEYS.reduce((a,k) => a + w[k], 0);
  for (const k of STAT_KEYS) h.statFrac[k] += 3 * w[k] / total;
  for (const k of STAT_KEYS){
    const whole = Math.floor(h.statFrac[k]);
    if (whole > 0){ h.stats[k] += whole; h.statFrac[k] -= whole; }
  }
}

function levelUp(S){
  const h = S.hero;
  const before = derived(h, S.gear).maxHP;
  h.level++;
  allocateStats(S);
  const after = derived(h, S.gear).maxHP;
  h.hp += Math.max(0, after - before);   // new max HP arrives as usable HP
  logEvent(S, "level", `${h.name} reaches level ${h.level}.`, 1);

  // Story beats (design doc §12) fire on LEVEL thresholds, not task counts,
  // and always — even on a level that also opens a blocking choice below.
  const newAct = actForLevel(h.level).n;
  if (newAct !== S.world.act){
    S.world.act = newAct;
    const variants = ACT_MAJOR[newAct][S.world.thread.antagonistType];
    logEvent(S, "story", fillTemplate(pick(variants), threadVars(S)), 2);
    if (S._meta){
      if (newAct === 2) unlockAchievement(S._meta, "actII", S);
      if (newAct === 3) unlockAchievement(S._meta, "actIII", S);
    }
  }
  if (h.level === 40 && S._meta) unlockAchievement(S._meta, "level40", S);
  if (MINOR_BEAT_LEVELS[h.level]){
    const actN = MINOR_BEAT_LEVELS[h.level];
    const sign = pick(ANTAGONIST_TYPES[S.world.thread.antagonistType].signs);
    const tmpl = pick(ACT_MINOR[actN]);
    logEvent(S, "story", fillTemplate(tmpl, threadVars(S, {sign})), 2);
  }

  // Class advancement is a blocking choice: the sim stops here and waits.
  if (h.level === 10 && CLASSES[h.cls].tier === 0){
    S.world.pendingChoice = {kind:"class", options:["soldier","scout","apprentice"]};
    S.world.state = "AWAITING_CHOICE";
    logEvent(S, "choice", `${h.name} stands at a crossroads. A path must be chosen.`, 2);
    return;
  }
  // Tier-2 advancement at L25 forks each tier-1 class four ways (design doc §6).
  if (h.level === 25 && CLASSES[h.cls].tier === 1){
    S.world.pendingChoice = {kind:"class2", options: ADVANCED_OF[h.cls]};
    S.world.state = "AWAITING_CHOICE";
    logEvent(S, "choice", `${h.name} feels the shape of what he might become.`, 2);
    return;
  }
  // Skill picks at the design doc's eight milestone levels (§8) — same
  // blocking machinery, drawn from whatever class's pool the hero currently
  // belongs to (novice at L5, tier-1 at L15/20, tier-2 at L30-50).
  if (SKILL_LEVELS.includes(h.level)){
    const opts = rollSkillOptions(S);
    if (opts.length){
      S.world.pendingChoice = {kind:"skill", options: opts};
      S.world.state = "AWAITING_CHOICE";
      logEvent(S, "choice", `${h.name} has learned enough to refine his craft.`, 2);
      return;
    }
  }
  // Zone changes are level-gated and automatic.
  const z = zoneForLevel(h.level);
  if (z.n !== S.world.zone) beginTravel(S, z.n);
}

// Which two (or fewer, if the pool is nearly exhausted) not-yet-owned skills
// to offer from the hero's current class pool. Pool sizes are chosen so this
// never comes up empty on a real progression path — see the comment above
// SKILLS.
function rollSkillOptions(S){
  const h = S.hero;
  const pool = (SKILL_POOLS[h.cls] || []).filter(k => !h.skills.includes(k));
  return shuffle(pool.slice()).slice(0, Math.min(2, pool.length));
}

// Pushes a skill onto the hero permanently. Cheat-death skills get queued
// separately (with their own flavor text) rather than folded into the
// generic race/gear cheatDeathCharges counter, so the log line that fires on
// consumption can still name the specific skill — see rollPeril().
function grantSkill(S, key){
  const h = S.hero;
  h.skills.push(key);
  const sk = SKILLS[key];
  if (sk && sk.effect.kind === "cheatdeath"){
    h.skillCheatDeathQueue = h.skillCheatDeathQueue || [];
    const n = sk.effect.amount || 1;
    for (let i = 0; i < n; i++) h.skillCheatDeathQueue.push(sk.effect.text);
  }
}

// Second Wind and its kin: called once per task after damage has resolved.
// Heals fire in hero.skills order; "once per merchant cycle" flags live in
// hero.skillState and are cleared in doMerchantTrip().
function checkTriggers(S){
  const h = S.hero;
  const d = derived(h, S.gear);
  const frac = h.hp / d.maxHP;
  for (const key of h.skills){
    const sk = SKILLS[key];
    if (!sk || sk.effect.kind !== "triggered") continue;
    const e = sk.effect;
    if (e.event !== "lowHp" || frac >= e.threshold) continue;
    h.skillState = h.skillState || {};
    if (e.once === "merchantCycle" && h.skillState[key]) continue;
    const amt = Math.round(d.maxHP * e.healFrac);
    h.hp = Math.min(d.maxHP, h.hp + amt);
    if (e.once === "merchantCycle") h.skillState[key] = true;
    logEvent(S, "trigger", e.text.replace("{name}", h.name).replace("{amt}", amt), 2);
  }
}

function beginTravel(S, zoneN){
  S.world.state = "TRAVELING";
  S.world.travelKind = "zone";
  S.world.travelMsLeft = TRAVEL_SECONDS * 1000;
  S.world.pendingZone = zoneN;
  logEvent(S, "travel", `${S.hero.name} sets out for ${ZONES[zoneN-1].name}.`, 1);
}
function arriveInZone(S){
  const n = S.world.pendingZone;
  S.world.zone = n;
  S.world.pendingZone = null;
  S.world.travelKind = null;
  S.world.state = "QUESTING";
  S.world.taskProgressMs = 0;
  S.world.taskName = pick(TASKS[n]);
  logEvent(S, "zone", ARRIVAL[n].replace("{name}", S.hero.name), 2);
}

/* ------------------------------ gear & drops ------------------------------ */

function rollTier(bump){
  // `bump` is now a numeric strength (0 = no bump, 1 = the merchant's standard
  // "slight tier bonus" per design doc §9) rather than a boolean, so the
  // Treasure Sense/Loreman's Eye drop-quality skill effect can add a partial
  // bump on top of — or independent of — the merchant's.
  bump = bump || 0;
  const keys = Object.keys(TIERS);
  let weights = keys.map(k => TIERS[k].weight);
  if (bump){
    const shift = Math.min(0.9, 0.2 * bump);
    weights = weights.map((w,i) => i === 0 ? w * (1 - shift) : w * (1 + shift));
    const sum = weights.reduce((a,b) => a+b, 0);
    weights = weights.map(w => w / sum);
  }
  const r = rng();
  let acc = 0;
  for (let i = 0; i < keys.length; i++){
    acc += weights[i];
    if (r < acc) return keys[i];
  }
  return keys[keys.length-1];
}

function rollItemStats(slot, budget){
  // 1-3 stats: the slot's favored stat(s) first, topped up from the full
  // stat list if the slot doesn't have enough favored stats to fill the roll.
  const count = randInt(1, Math.min(3, budget));
  const pool = shuffle(SLOT_FAVORED[slot].slice());
  const chosen = pool.slice(0, count);
  while (chosen.length < count){
    const k = pick(STAT_KEYS);
    if (!chosen.includes(k)) chosen.push(k);
  }
  const base = Math.floor(budget / count);
  let remainder = budget - base * count;
  const stats = {};
  for (const k of chosen){
    stats[k] = base + (remainder > 0 ? 1 : 0);
    if (remainder > 0) remainder--;
  }
  return stats;
}

function genItemName(slot, tier){
  return `${pick(PREFIX_BY_TIER[tier])} ${pick(BASE_BY_SLOT[slot])} of ${pick(SUFFIX_BY_TIER[tier])}`;
}

// Gloves and boots base names (Gauntlets, Sabatons, Vambraces, Wraps…) are
// inherently plural — they come in pairs — so "a/an" reads wrong no matter
// which base got picked ("an epic Thornbound Sabatons"). Rather than force
// every base name in BASE_BY_SLOT singular (losing the flavor of "a pair of
// Gauntlets"), phrase those two slots with "a pair of" instead of an article.
// Every other slot's bases are genuinely singular, so they keep aOrAn().
const PLURAL_SLOTS = new Set(["gloves","boots"]);
function itemPhrase(item){
  const tierWord = (item.tier === "epic" || item.tier === "legendary") ? item.tier + " " : "";
  if (PLURAL_SLOTS.has(item.slot)) return `a pair of ${tierWord}${item.name}`;
  // The article agrees with whatever actually follows it — "an epic Sallet",
  // not "a epic Sallet" — so it must be read off the tier word when present.
  return `${aOrAn(tierWord || item.name)} ${tierWord}${item.name}`;
}

// slot omitted → random (a task drop can land in any slot); passed explicitly
// for merchant stock, which targets the hero's weakest equipped slot.
// skillBump adds the hero's dropQuality skill effect on top of the merchant bump.
// forceTier (Phase 7) skips the roll entirely — used for the ascendOnce
// starting-relic reward, where the tier is a fixed unlock, not a drop.
function generateItem(zoneN, slot, tierBump, skillBump, forceTier){
  const z = ZONES[zoneN-1];
  slot = slot || pick(SLOT_KEYS);
  const ilvl = randInt(z.ilvl[0], z.ilvl[1]);
  const tier = forceTier || rollTier((tierBump ? 1 : 0) + (skillBump || 0));
  const score = ilvl * TIERS[tier].mult;
  const budget = Math.max(1, Math.round(score * BALANCE.gearBudget));
  const item = {
    name: genItemName(slot, tier), slot, tier, ilvl, score,
    stats: rollItemStats(slot, budget), cheatDeath: 0,
  };
  // Relics are the only slot that can grant a cheat-death charge — kept
  // uncommon so it still reads as a notable find rather than a routine roll.
  if (slot === "relic" && rng() < 0.15) item.cheatDeath = 1;
  return item;
}

function equipItem(S, item){
  const old = S.gear[item.slot];
  if (old && old.cheatDeath) S.hero.cheatDeathCharges = Math.max(0, S.hero.cheatDeathCharges - old.cheatDeath);
  S.gear[item.slot] = item;
  if (item.cheatDeath) S.hero.cheatDeathCharges += item.cheatDeath;
  checkFullRareSet(S);
  return old;
}

function rollDrop(S){
  const h = S.hero;
  const d = derived(h, S.gear);
  if (rng() >= d.dropChance) return;
  const item = generateItem(S.world.zone, null, false, d.dropTierBump);
  S.stats.itemsFound++;
  if (item.tier === "legendary" && S._meta) unlockAchievement(S._meta, "legendaryFound", S);
  const equipped = S.gear[item.slot];
  if (!equipped || item.score > equipped.score){
    equipItem(S, item);
    const imp = (item.tier === "epic" || item.tier === "legendary") ? 2 : 1;
    const text = equipped
      ? `${h.name} finds ${itemPhrase(item)} — it outclasses the ${equipped.name} and takes its place.`
      : `${h.name} finds ${itemPhrase(item)} and arms himself with it.`;
    logEvent(S, "gear", text, imp);
    return;
  }
  S.inventory.push(item);
}

/* ----------------------------- merchant trips ------------------------------ */
// Inventory-full is the trigger; the trip itself (sell/buy/heal) is
// instantaneous story-time, bookended by the same TRAVELING machinery zone
// changes use, just with an AT_MERCHANT waypoint state in between.

function beginMerchantTrip(S){
  S.world.state = "TRAVELING";
  S.world.travelKind = "merchant_out";
  S.world.travelMsLeft = MERCHANT_SECONDS * 1000;
  logEvent(S, "travel", `${S.hero.name}'s pack is full. He turns back toward town.`, 1);
}

function doMerchantTrip(S){
  const h = S.hero;
  const z = ZONES[S.world.zone - 1];
  const d = derived(h, S.gear);
  const cha = d.stats.cha;
  const goldAtTripStart = h.gold; // debug-only, for balance measurement (see hook below)

  // Prices track the zone's economic tier, not just itemScore — see the
  // BALANCE.priceZoneExp comment. zoneFactor is >1 in every zone past the
  // first and applies identically to buying and selling, so selling stays
  // meaningful relative to buying at every depth.
  const zoneFactor = Math.pow(z.gold / ZONES[0].gold, BALANCE.priceZoneExp);
  const priceOf = score => Math.round(score * BALANCE.buyPriceMult * zoneFactor * (1 - cha * 0.005) * d.buyMult);

  let earned = 0;
  for (const item of S.inventory) earned += Math.round(item.score * BALANCE.sellPriceMult * zoneFactor * (1 + cha * 0.005) * d.sellMult);
  const soldCount = S.inventory.length;
  h.gold += earned;
  S.stats.goldEarned += earned;
  S.inventory = [];

  function weakestSlot(){
    let slot = SLOT_KEYS[0], score = Infinity;
    for (const s of SLOT_KEYS){
      const sc = S.gear[s] ? S.gear[s].score : 0;
      if (sc < score){ score = sc; slot = s; }
    }
    return {slot, score};
  }

  // Keep buying upgrades for the weakest slot, re-evaluating after each
  // purchase, while he can afford them and they're a genuine upgrade — capped
  // per trip (merchantMaxBuys) so a rich hero re-kits, not re-kits forever.
  const bought = [];
  let blockedByPrice = false;
  let spent = 0;
  while (bought.length < BALANCE.merchantMaxBuys){
    const {slot, score} = weakestSlot();
    const stock = generateItem(z.n, slot, true, d.dropTierBump);
    if (stock.score <= score) break;          // nothing better on offer for this slot tonight
    const price = priceOf(stock.score);
    if (h.gold < price){ blockedByPrice = true; break; }
    h.gold -= price;
    spent += price;
    equipItem(S, stock);
    bought.push(stock);
  }

  // Commissioning: once ordinary upgrades are exhausted, surplus gold can pay
  // a premium to guarantee a specific slot at a floor tier rather than hoping
  // stock rolls well — what a rich hero spends runoff on. Deliberately skips
  // the relic slot while the L48+ epic-relic ascension guarantee below still
  // needs it, so the two never bid on the same purchase, and deliberately
  // guarantees a tier BELOW that guarantee's epic/legendary floor, so
  // commissioning is never a substitute for it.
  let commissioned = null;
  {
    const relicGuaranteePending = h.level >= 48 && !hasEpicOrBetterRelic(S.gear);
    let cSlot = null, cScore = Infinity;
    for (const s of SLOT_KEYS){
      if (s === "relic" && relicGuaranteePending) continue;
      const sc = S.gear[s] ? S.gear[s].score : 0;
      if (sc < cScore){ cScore = sc; cSlot = s; }
    }
    if (cSlot){
      const commission = generateItem(z.n, cSlot, true, d.dropTierBump, BALANCE.commissionTier);
      const price = Math.round(commission.score * BALANCE.buyPriceMult * BALANCE.commissionPriceMult
                                * zoneFactor * (1 - cha * 0.005) * d.buyMult);
      if (commission.score > cScore && h.gold >= price){
        h.gold -= price;
        spent += price;
        equipItem(S, commission);
        commissioned = commission;
      }
    }
  }

  // Ascension-gate guarantee (CLAUDE.md "known polish", design doc §10):
  // reaching level 50 unlocks the confrontation only with an Epic-or-better
  // relic equipped, but only ~2.2 Epic+ relics drop per full run on average —
  // roughly 11% of heroes who reach L50 would have no relic and no way to
  // ever trigger their own ending. Rather than relaxing the gate, once the
  // hero is deep enough to plausibly hit 50, the merchant makes sure a relic
  // worthy of the confrontation is on the table.
  if (h.level >= 48 && !hasEpicOrBetterRelic(S.gear)){
    const rilvl = randInt(z.ilvl[0], z.ilvl[1]);
    const rtier = rng() < BALANCE.confrontRelicLegendaryChance ? "legendary" : "epic";
    const rscore = rilvl * TIERS[rtier].mult;
    const rbudget = Math.max(1, Math.round(rscore * BALANCE.gearBudget));
    const relic = {name: genItemName("relic", rtier), slot:"relic", tier: rtier, ilvl: rilvl, score: rscore,
                    stats: rollItemStats("relic", rbudget), cheatDeath: rng() < 0.15 ? 1 : 0};
    const relicPrice = priceOf(relic.score);
    const curScore = S.gear.relic ? S.gear.relic.score : 0;
    if (relic.score > curScore && h.gold >= relicPrice){
      h.gold -= relicPrice;
      spent += relicPrice;
      equipItem(S, relic);
      if (relic.tier === "legendary" && S._meta) unlockAchievement(S._meta, "legendaryFound", S);
      logEvent(S, "gear", `${h.name} finds the merchant has something rarer than usual laid out — ${itemPhrase(relic)} — and doesn't leave without it.`, 2);
    }
  }

  // The heal is the point of the trip — merchant trips are effectively extra
  // lives, which makes their frequency and depth a primary balancing knob.
  const mMax = derived(h, S.gear).maxHP;
  h.hp = Math.min(mMax, h.hp + mMax * BALANCE.merchantHeal);
  S.stats.merchantTrips = (S.stats.merchantTrips || 0) + 1;
  h.skillState = {};   // refresh once-per-cycle triggered skills (design doc §9 step 4)
  logEvent(S, "merchant", merchantTripLine(h, soldCount, earned, bought, commissioned, blockedByPrice), 1);
  // Debug-only hook for balance measurement (see CLAUDE.md testing notes) —
  // a no-op unless a test harness has set window._trackMerchant.
  if (typeof window !== "undefined" && window._trackMerchant)
    window._trackMerchant({zone: z.n, level: h.level, earned, spent, boughtCount: bought.length,
                            commissioned: !!commissioned, goldAfter: h.gold, goldAtTripStart});
}

// Phrase banks for the two shapes a trip with real stakes can take: a
// spend-down (multiple upgrades bought) and being priced out (couldn't
// afford what was on offer). Kept the same grim, grounded register as
// PERILS/DODGE_TAGS rather than a receipt.
const MERCHANT_REKIT_LINES = [
  "leaves the stall a harder man to kill than he walked in",
  "spends like he expects to need every bit of it",
  "walks out re-kitted, lighter of purse and heavier of gear",
];
const MERCHANT_PRICED_OUT_LINES = [
  "what's worth having tonight is priced past him",
  "the good gear wants a richer man's coin",
  "he counts his coin twice and still can't stretch to it",
];

function merchantTripLine(h, soldCount, earned, bought, commissioned, blockedByPrice){
  const soldPart = soldCount > 0
    ? `unloads ${soldCount} piece${soldCount === 1 ? "" : "s"} of salvage for ${earned} gold`
    : "finds nothing worth selling";

  let outcome = "";
  if (bought.length > 1) outcome = `and ${pick(MERCHANT_REKIT_LINES)} — ${bought.length} pieces replaced`;
  else if (bought.length === 1) outcome = `and walks out with ${itemPhrase(bought[0])}`;
  else if (blockedByPrice) outcome = `but ${pick(MERCHANT_PRICED_OUT_LINES)}`;

  let text = `${h.name} makes for the merchant's stall — ${soldPart}${outcome ? " " + outcome : ""}. `;
  if (commissioned) text += `He pays a hard premium to have ${itemPhrase(commissioned)} made to order. `;
  text += `Wounds close, breath comes easy again, and he turns back to the road.`;
  return text;
}

function arriveAtMerchant(S){
  S.world.state = "AT_MERCHANT";
  doMerchantTrip(S);
  S.world.state = "TRAVELING";
  S.world.travelKind = "merchant_return";
  S.world.travelMsLeft = MERCHANT_SECONDS * 1000;
}

function arriveBackFromMerchant(S){
  S.world.travelKind = null;
  S.world.state = "QUESTING";
  S.world.taskProgressMs = 0;
  S.world.taskName = pick(TASKS[S.world.zone]);
}

function completeTask(S){
  const h = S.hero, w = S.world;
  const d = derived(h, S.gear);
  const z = ZONES[w.zone - 1];

  const xp   = Math.round(z.xp   * d.xpMult);
  const gold = Math.round(z.gold * d.goldMult);
  h.xp += xp;
  h.gold += gold;
  S.stats.tasksCompleted++;
  S.stats.goldEarned += gold;

  // Regen lands before the peril roll, so the day's toll is measured against
  // a topped-up hero rather than whatever HP he happened to end the last task at.
  h.hp = Math.min(d.maxHP, h.hp + d.regenPerTask);

  logEvent(S, "task", `${w.taskName} — ${xp} xp, ${gold} gold.`, 0);

  rollDrop(S);
  rollPeril(S);
  if (w.state !== "QUESTING") return;   // dead — the sim halts, nothing left to check
  checkTriggers(S);

  // Level-up may cascade; stop immediately if it blocks or starts travel.
  let guard = 0;
  while (h.level < 50 && h.xp >= xpToNext(h.level) && guard++ < 60){
    h.xp -= xpToNext(h.level);
    levelUp(S);
    if (w.state !== "QUESTING") return;
  }
  if (h.level >= 50) h.xp = 0;

  // Ascension gate (design doc §10): level 50 + an Epic-or-better relic.
  // Checked every task once level 50 so a relic gained here via a drop, or
  // via a merchant trip, triggers the confrontation on the very next tick
  // rather than only at the moment of leveling.
  if (h.level >= 50 && w.state === "QUESTING" && hasEpicOrBetterRelic(S.gear)){
    beginConfrontation(S);
    return;
  }

  if (S.inventory.length >= invSlots(S)){ beginMerchantTrip(S); return; }

  w.taskName = pick(TASKS[w.zone]);
}

function hasEpicOrBetterRelic(gear){
  const r = gear.relic;
  return !!(r && (r.tier === "epic" || r.tier === "legendary"));
}

// Percentage-of-maxHP damage is deliberate (design doc §7) — it keeps the
// danger curve stable as HP scales, so tuning touches one number, not two.
function rollPeril(S){
  const h = S.hero, w = S.world, d = derived(h, S.gear);
  const z = ZONES[w.zone - 1];
  if (rng() >= z.peril * d.perilMult * BALANCE.perilChanceMult) return;

  const desc = pick(PERILS[z.n]);
  if (rng() < d.evasion){
    logEvent(S, "peril", `${desc} — ${pick(DODGE_TAGS)}`, 0);
    S.stats.perilsSurvived++;
    return;
  }

  const frac = (z.dmg[0] + rng() * (z.dmg[1] - z.dmg[0])) * BALANCE.perilDmgMult;
  const pool = BALANCE.dmgHpBlend * d.maxHP
             + (1 - BALANCE.dmgHpBlend) * refHP(h.level);
  const dmg = Math.round(pool * frac * (1 - d.mitigation));
  const wasSafe = h.hp / d.maxHP >= 0.20;
  const after = h.hp - dmg;

  if (after > 0){
    h.hp = after;
    logEvent(S, "peril", `${desc} — ${dmg} damage.`, 0);
    S.stats.perilsSurvived++;
    // Near-death is on the permanent-retention list, but only the crossing,
    // not every subsequent task spent under the threshold.
    if (wasSafe && h.hp / d.maxHP < 0.20)
      logEvent(S, "neardeath", `${h.name} is barely standing. HP critical.`, 1);
    return;
  }

  // Skill-granted charges (Ancestral Ward and kin) carry their own flavor
  // text and are spent before the generic race/gear charges, so a hero who
  // has one always gets the named line rather than the generic one.
  if (h.skillCheatDeathQueue && h.skillCheatDeathQueue.length){
    const text = h.skillCheatDeathQueue.shift();
    h.hp = 1;
    logEvent(S, "cheatdeath", `${desc} — ${text.replace("{name}", h.name)}`, 2);
    S.stats.perilsSurvived++;
    return;
  }

  if (h.cheatDeathCharges > 0){
    h.cheatDeathCharges--;
    h.hp = 1;
    logEvent(S, "cheatdeath", `${desc} — ${pick(CHEATDEATH_LINES).replace("{name}", h.name)}`, 2);
    S.stats.perilsSurvived++;
    return;
  }

  h.hp = 0;
  w.state = "DEAD";
  w.killedBy = desc;
  w.epilogueIdx = randInt(0, EPILOGUES.length - 1);
  S.stats.deathTime = w.clock;
  onHeroDeath(S);
  logEvent(S, "death", `${desc} — ${h.name}'s road ends here.`, 2);
}

// Begins the scripted ~10-step final confrontation (design doc §10). Not a
// blocking choice — the gate (level 50 + Epic-or-better relic) is checked
// automatically in completeTask(), and once satisfied the sim just walks
// into the climax the way it walks into a zone change.
function beginConfrontation(S){
  const w = S.world;
  w.state = "CONFRONTATION";
  w.confrontation = {step: 0};
  w.taskProgressMs = 0;
  logEvent(S, "confrontation", fillTemplate(pick(CONFRONTATION_ANNOUNCE), threadVars(S)), 2);
}

// One step of the confrontation: a scripted narrative beat (not a random
// task line) plus an elevated peril roll. Ten of these, survived in a row,
// is ascension.
function completeConfrontationStep(S){
  const h = S.hero, w = S.world;
  const d = derived(h, S.gear);
  const type = w.thread.antagonistType;

  // Some recovery between clashes, but nowhere near a merchant's full heal —
  // there is no merchant inside the confrontation. BALANCE.confrontRegenMult
  // is the knob (0 = none, 1 = a full normal task's regen).
  h.hp = Math.min(d.maxHP, h.hp + d.regenPerTask * BALANCE.confrontRegenMult);

  const seq = CONFRONTATION_SEQUENCE[type];
  const idx = Math.min(w.confrontation.step, seq.length - 1);
  logEvent(S, "confrontation", fillTemplate(seq[idx], threadVars(S)), 2);

  rollConfrontationPeril(S);
  if (w.state !== "CONFRONTATION") return;   // death ended it, same as rollPeril()

  w.confrontation.step++;
  if (w.confrontation.step >= CONFRONTATION_STEPS){
    w.state = "ASCENDED";
    w.ascendedAt = w.clock;
    w.ascensionEpilogueIdx = randInt(0, ASCENSION_EPILOGUES.length - 1);
    logEvent(S, "ascension", fillTemplate(pick(ASCENSION_LINES[type]), threadVars(S)), 2);
    if (S._meta){
      S._meta.ascensionCount = (S._meta.ascensionCount || 0) + 1;
      if (S._meta.ascensionCount === 1) unlockAchievement(S._meta, "ascendOnce", S);
      if (S._meta.ascensionCount === 3) unlockAchievement(S._meta, "ascendThrice", S);
    }
  }
}

// Elevated-danger analogue of rollPeril() for the confrontation only — own
// BALANCE knobs (confrontPerilChance/confrontDmgMin/Max), own flavor bank,
// but the exact same evasion/mitigation/cheat-death machinery so a hero's
// build still matters at the very end.
function rollConfrontationPeril(S){
  const h = S.hero, w = S.world, d = derived(h, S.gear);
  const type = w.thread.antagonistType;
  if (rng() >= BALANCE.confrontPerilChance * d.perilMult) return;

  const desc = fillTemplate(pick(CONFRONTATION_PERILS[type]), threadVars(S));
  if (rng() < d.evasion){
    logEvent(S, "peril", `${desc} — ${pick(DODGE_TAGS)}`, 1);
    S.stats.perilsSurvived++;
    return;
  }

  const frac = BALANCE.confrontDmgMin + rng() * (BALANCE.confrontDmgMax - BALANCE.confrontDmgMin);
  const pool = BALANCE.dmgHpBlend * d.maxHP + (1 - BALANCE.dmgHpBlend) * refHP(h.level);
  const dmg = Math.round(pool * frac * (1 - d.mitigation));
  const after = h.hp - dmg;

  if (after > 0){
    h.hp = after;
    logEvent(S, "peril", `${desc} — ${dmg} damage.`, 1);
    S.stats.perilsSurvived++;
    return;
  }

  if (h.skillCheatDeathQueue && h.skillCheatDeathQueue.length){
    const text = h.skillCheatDeathQueue.shift();
    h.hp = 1;
    logEvent(S, "cheatdeath", `${desc} — ${text.replace("{name}", h.name)}`, 2);
    S.stats.perilsSurvived++;
    return;
  }
  if (h.cheatDeathCharges > 0){
    h.cheatDeathCharges--;
    h.hp = 1;
    logEvent(S, "cheatdeath", `${desc} — ${pick(CHEATDEATH_LINES).replace("{name}", h.name)}`, 2);
    S.stats.perilsSurvived++;
    return;
  }

  h.hp = 0;
  w.state = "DEAD";
  w.killedBy = desc;
  w.epilogueIdx = randInt(0, EPILOGUES.length - 1);
  w.diedInConfrontation = true;
  S.stats.deathTime = w.clock;
  onHeroDeath(S);
  logEvent(S, "death", `${desc} — ${h.name}'s road ends here.`, 2);
}

/**
 * Consume `ms` of simulated time. Returns the milliseconds it could NOT spend
 * because the hero entered a blocking state (AWAITING_CHOICE / DEAD /
 * ASCENDED). Returning leftover instead of discarding it is what makes
 * bank-and-chain catch-up work.
 */
function advance(S, ms){
  let guard = 0;
  while (ms > 0){
    if (++guard > 500000) break;              // paranoia against a zero-cost state
    const w = S.world;
    if (w.state === "QUESTING"){
      const need = derived(S.hero, S.gear).taskMs - w.taskProgressMs;
      if (ms < need){ w.taskProgressMs += ms; w.clock += ms; return 0; }
      ms -= need; w.taskProgressMs = 0; w.clock += need;
      completeTask(S);
    } else if (w.state === "TRAVELING"){
      if (ms < w.travelMsLeft){ w.travelMsLeft -= ms; w.clock += ms; return 0; }
      ms -= w.travelMsLeft; w.clock += w.travelMsLeft; w.travelMsLeft = 0;
      if (w.travelKind === "merchant_out") arriveAtMerchant(S);
      else if (w.travelKind === "merchant_return") arriveBackFromMerchant(S);
      else arriveInZone(S);
    } else if (w.state === "CONFRONTATION"){
      const need = derived(S.hero, S.gear).taskMs - w.taskProgressMs;
      if (ms < need){ w.taskProgressMs += ms; w.clock += ms; return 0; }
      ms -= need; w.taskProgressMs = 0; w.clock += need;
      completeConfrontationStep(S);
    } else {
      return ms;                              // blocked (AWAITING_CHOICE / DEAD / ASCENDED)
    }
  }
  return 0;
}

function resolveChoice(S, optionKey){
  const c = S.world.pendingChoice;
  if (!c) return;
  if (c.kind === "class"){
    S.hero.cls = optionKey;
    S.hero.classPath.push(optionKey);
    logEvent(S, "class", `${S.hero.name} takes up the way of the ${CLASSES[optionKey].name}.`, 2);
  } else if (c.kind === "class2"){
    S.hero.cls = optionKey;
    S.hero.classPath.push(optionKey);
    logEvent(S, "class", `${S.hero.name} takes up the way of the ${CLASSES[optionKey].name}.`, 2);
    const passiveKey = CLASSES[optionKey].passive;
    if (passiveKey){
      grantSkill(S, passiveKey);
      const sk = SKILLS[passiveKey];
      logEvent(S, "skill", `${S.hero.name} awakens to ${sk.name} — ${sk.blurb}`, 2);
    }
    if (S._meta){
      S._meta.classesReached = S._meta.classesReached || [];
      if (!S._meta.classesReached.includes(optionKey)) S._meta.classesReached.push(optionKey);
      if (S._meta.classesReached.length >= 12) unlockAchievement(S._meta, "allAdvancedClasses", S);
    }
  } else if (c.kind === "skill"){
    grantSkill(S, optionKey);
    const sk = SKILLS[optionKey];
    logEvent(S, "skill", `${S.hero.name} learns ${sk.name} — ${sk.blurb}`, 2);
  }
  S.world.pendingChoice = null;
  S.world.state = "QUESTING";
  const z = zoneForLevel(S.hero.level);
  if (z.n !== S.world.zone) beginTravel(S, z.n);
}

/* ========================== end simulation core ========================== */

/* ------------------------------ persistence ------------------------------ */

let S = null;
let META = null;

function defaultMeta(){
  return {version: META_VERSION, achievements:[], unlocks:{}, hall:[], heroesRun:0,
          deathZones:[], classesReached:[], ascensionCount:0, heroesLaidToRest:0};
}
// Every new meta field needs both a default here AND a fallback below, same
// discipline as the hero save's migrate() — a corrupted or pre-Phase-7
// goquest_meta must load cleanly, not throw.
function migrateMeta(m){
  if (!m || typeof m !== "object") return defaultMeta();
  if (m.version === undefined) m.version = 1;
  if (!Array.isArray(m.achievements)) m.achievements = [];
  if (!m.unlocks || typeof m.unlocks !== "object") m.unlocks = {};
  if (!Array.isArray(m.hall)) m.hall = [];
  if (m.heroesRun === undefined) m.heroesRun = 0;
  // v1 -> v2 (Phase 7: achievement bookkeeping fields)
  if (!Array.isArray(m.deathZones)) m.deathZones = [];
  if (!Array.isArray(m.classesReached)) m.classesReached = [];
  if (m.ascensionCount === undefined) m.ascensionCount = 0;
  if (m.heroesLaidToRest === undefined) m.heroesLaidToRest = 0;
  m.version = META_VERSION;
  return m;
}
function loadMeta(){
  try {
    const raw = localStorage.getItem(META_KEY);
    if (raw) return migrateMeta(JSON.parse(raw));
  } catch(e){ console.warn("meta save unreadable", e); }
  return defaultMeta();
}
function saveMeta(){ try{ localStorage.setItem(META_KEY, JSON.stringify(META)); }catch(e){} }

function saveGame(){
  if (!S) return;
  S.lastTick = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }
  catch(e){ pruneLog(S); try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e2){} }
}
function loadGame(){
  let raw;
  try { raw = localStorage.getItem(SAVE_KEY); } catch(e){ return null; }
  if (!raw) return null;
  try {
    const s = JSON.parse(raw);
    if (!s || !s.hero || !s.world) return null;
    if (!RACES[s.hero.race] || !CLASSES[s.hero.cls]) return null;
    return attachMeta(migrate(s), META);
  } catch(e){ console.warn("hero save corrupt, starting fresh", e); return null; }
}
function migrate(s){
  // Version chain lives here. Every new field needs a default AND a fallback.
  if (s.version === undefined) s.version = 1;
  if (s.world.bankedMs === undefined) s.world.bankedMs = 0;
  if (!s.hero.statFrac){ s.hero.statFrac = {}; for (const k of STAT_KEYS) s.hero.statFrac[k] = 0; }
  if (!s.world.clock) s.world.clock = s.lastTick || Date.now();
  if (s.world.killedBy === undefined) s.world.killedBy = null;
  if (s.world.epilogueIdx === undefined) s.world.epilogueIdx = null;
  // v2 -> v3 (Phase 4, gear/inventory/merchant). v2 saves already carry six
  // null gear slots and an empty inventory (declared ahead of schedule in
  // Phase 3), so this is gentle: only the new bookkeeping fields.
  if (!s.gear) s.gear = {weapon:null, armor:null, helm:null, gloves:null, boots:null, relic:null};
  if (!s.inventory) s.inventory = [];
  if (s.world.travelKind === undefined) s.world.travelKind = null;
  if (s.stats.merchantTrips === undefined) s.stats.merchantTrips = 0;
  // v3 -> v4 (Phase 5, classes & skills). hero.skills/classPath already
  // existed ahead of schedule; only the new skill-runtime bookkeeping needs a
  // fallback here.
  if (!s.hero.skillCheatDeathQueue) s.hero.skillCheatDeathQueue = [];
  if (!s.hero.skillState) s.hero.skillState = {};
  // v4 -> v5 (Phase 6, story/acts/ascension). world.thread and world.act
  // already existed as stub fields (thread always null, act always 1, since
  // nothing before this phase ever wrote to either) — populate them for
  // saves predating this phase rather than adding parallel fields. act can't
  // be fixed with an undefined/null check like the others below: it was
  // always present, just always wrong (stuck at 1) for anyone past Act I, so
  // this has to be gated on save version instead of field presence.
  if (!s.world.thread) s.world.thread = rollThread();
  if (s.version < 5) s.world.act = actForLevel(s.hero.level).n;
  if (s.world.confrontation === undefined) s.world.confrontation = null;
  if (s.world.diedInConfrontation === undefined) s.world.diedInConfrontation = false;
  if (s.world.ascendedAt === undefined) s.world.ascendedAt = null;
  if (s.world.ascensionEpilogueIdx === undefined) s.world.ascensionEpilogueIdx = null;
  // v5 -> v6 (Phase 7, meta-progression). Baked-in unlock effects live on the
  // hero itself (see createState) — old saves predate both fields entirely.
  if (s.hero.metaDropBonus === undefined) s.hero.metaDropBonus = 0;
  if (s.hero.metaInvBonus === undefined) s.hero.metaInvBonus = 0;
  s.version = SAVE_VERSION;
  return s;
}

/* --------------------------- offline catch-up ---------------------------- */
// Rob's call (2026-08-01): on hitting a blocking choice we BANK the unspent
// time rather than discarding it. Resolving the choice spends the remainder,
// and may block again at the next gate — the morning becomes a chain of
// decisions, each followed by a burst of chronicle.

let catchupBusy = false;

function runCatchUp(totalMs, done){
  if (totalMs <= 0){ done("complete", 0); return; }
  catchupBusy = true;
  const chunkMs = CATCHUP_BATCH * TASK_DURATION * 1000;
  let remaining = totalMs;

  function step(){
    const offer = Math.min(chunkMs, remaining);
    const left  = advance(S, offer);
    remaining -= (offer - left);
    if (left > 0){                       // blocked — hold the rest
      S.world.bankedMs = remaining;
      catchupBusy = false;
      done("blocked", totalMs - remaining);
      return;
    }
    if (remaining <= 0){
      S.world.bankedMs = 0;
      catchupBusy = false;
      done("complete", totalMs);
      return;
    }
    renderCatchupProgress(1 - remaining / totalMs, totalMs);
    setTimeout(step, 0);
  }
  step();
}

function snapshot(){
  return {level:S.hero.level, gold:S.hero.gold, zone:S.world.zone,
          tasks:S.stats.tasksCompleted, logLen:S.log.length};
}
function buildSummary(before, elapsedMs){
  const notable = S.log.slice(before.logLen).filter(e => e.imp >= 1);
  return {
    elapsedMs,
    tasks: S.stats.tasksCompleted - before.tasks,
    levelFrom: before.level, levelTo: S.hero.level,
    gold: S.hero.gold - before.gold,
    zoneFrom: before.zone, zoneTo: S.world.zone,
    // Generous cap — this feeds the categorized WYWA list, not a raw dump, so
    // it can afford to hold a full chained night's worth of notable beats.
    notable: notable.slice(-40),
  };
}

let pendingSummary = null;

function bootCatchUp(){
  const elapsedRaw = Date.now() - (S.lastTick || Date.now());
  const capped = Math.min(Math.max(0, elapsedRaw), MAX_OFFLINE_HRS * 3600 * 1000);
  const banked = S.world.bankedMs || 0;
  S.world.bankedMs = 0;
  const total = capped + banked;
  if (total < 5000 || S.world.state === "DEAD" || S.world.state === "ASCENDED"){
    S.lastTick = Date.now();
    S.world.clock = Date.now();
    render();
    startLiveLoop();
    return;
  }
  // Night events are stamped from the moment he was left alone, forward.
  if (!S.world.clock || S.world.clock > S.lastTick) S.world.clock = S.lastTick;
  const before = snapshot();
  renderCatchupProgress(0, total);
  runCatchUp(total, (why, spent) => {
    S.lastTick = Date.now();
    if (why === "complete") S.world.clock = Date.now();
    pendingSummary = buildSummary(before, spent);
    saveGame();
    render();
    startLiveLoop();
  });
}

// Called after the player resolves a blocking choice: spend what was banked.
function spendBanked(){
  const banked = S.world.bankedMs || 0;
  if (banked <= 0){ render(); return; }
  S.world.bankedMs = 0;
  const before = snapshot();
  renderCatchupProgress(0, banked);
  runCatchUp(banked, (why, spent) => {
    S.lastTick = Date.now();
    if (why === "complete") S.world.clock = Date.now();
    const sum = buildSummary(before, spent);
    // Fold into the existing card rather than replacing it, so a chain of
    // three choices still reads as one night.
    pendingSummary = pendingSummary ? mergeSummary(pendingSummary, sum) : sum;
    saveGame();
    render();
  });
}
function mergeSummary(a, b){
  return {elapsedMs: a.elapsedMs + b.elapsedMs, tasks: a.tasks + b.tasks,
          levelFrom: a.levelFrom, levelTo: b.levelTo, gold: a.gold + b.gold,
          zoneFrom: a.zoneFrom, zoneTo: b.zoneTo,
          notable: a.notable.concat(b.notable).slice(-40)};
}

/* ------------------------------- live loop ------------------------------- */

let liveTimer = null;
function startLiveLoop(){
  if (liveTimer) clearInterval(liveTimer);
  S.lastTick = Date.now();
  liveTimer = setInterval(tickLive, 250);
}
function tickLive(){
  if (!S || catchupBusy) return;
  const now = Date.now();
  const dt = now - S.lastTick;
  S.lastTick = now;
  if (dt <= 0) return;
  const before = S.world.state;
  const achBefore = (S._meta && S._meta.achievements) ? S._meta.achievements.length : 0;
  advance(S, Math.min(dt, 60000));
  const achAfter = (S._meta && S._meta.achievements) ? S._meta.achievements.length : 0;
  if (S.stats.tasksCompleted % 20 === 0 && S.world.taskProgressMs < 300) saveGame();
  // An achievement firing mid-tick is worth a full render (banner + chronicle
  // entry) immediately, not just on the next state change.
  if (S.world.state !== before || achAfter !== achBefore) { saveGame(); render(); }
  else renderLive();
}

/* --------------------------------- render -------------------------------- */

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Math.round(n).toLocaleString();
function fmtDur(ms){
  const h = Math.floor(ms/3600000), m = Math.round(ms%3600000/60000);
  if (h && m) return `${h}h ${m}m`;
  if (h) return `${h}h`;
  return `${m}m`;
}

let activeTab = "stats";
let metaView = null;          // null | "hall" | "achievements" — meta-scoped, outlives any hero
let retireConfirmOpen = false;

function render(){
  if (metaView === "hall"){ renderHall(); return; }
  if (metaView === "achievements"){ renderAchievements(); return; }
  if (!S){ renderCreation(); return; }
  if (retireConfirmOpen){ renderRetireConfirm(); return; }
  if (S.world.state === "DEAD"){ renderDeath(); return; }
  if (S.world.state === "ASCENDED"){ renderAscension(); return; }
  if (S.world.state === "AWAITING_CHOICE" && S.world.pendingChoice){ renderChoice(); return; }
  renderMain();
}

// Small nav row shown on both the between-heroes creation screen and the

}

function modText(mods){

function renderDeath(){
  const h = S.hero, w = S.world, d = derived(h, S.gear);

function retireHero(){
  const h = S.hero, w = S.world;
  const lived = Math.max(0, w.clock - S.stats.birthTime);
  META.hall.push({
    name: h.name, race: h.race, cls: h.cls,
    classPath: h.classPath.map(k => (CLASSES[k] ? CLASSES[k].name : k)),
    level: h.level, zone: w.zone, hoursLived: r2(lived / 3600000),
    cause: "Stepped off the road while he still could", status: "Retired", at: w.clock,
  });
  trimHall(META);
  saveMeta();
  try { localStorage.removeItem(SAVE_KEY); } catch(e){}
  S = null;
  retireConfirmOpen = false;
  render();
}

// Hall of Legends — every hero who has left the road, one way or another.
// The one place a player sees their whole history (design doc's keepsake
// screen); newest first, capped at HALL_MAX so localStorage can't grow
// without bound over a long-lived player.
function renderHall(){
  const entries = META.hall.slice().reverse();
  const rows = entries.length
    ? entries.map(hallRow).join("")
    : `<div class="empty">No one has yet returned from the road, one way or another.</div>`;
  app.innerHTML = `
    <div class="card">
      <h2>Hall of Legends</h2>
      <p class="muted tiny">Every hero who has left the road — fallen, ascended, or retired.</p>
    </div>
    <div class="card">${rows}</div>
    <button class="btn ghost" id="hall-back">Back</button>`;
  document.getElementById("hall-back").addEventListener("click", () => { metaView = null; render(); });
}
function hallRow(e){
  const statusColor = {Fallen: "var(--blood)", Legend: "var(--gold)", Retired: "var(--sky)"}[e.status] || "var(--ink-dim)";
  const path = (e.classPath && e.classPath.length)
    ? e.classPath.join(" &rarr; ")
    : esc(CLASSES[e.cls] ? CLASSES[e.cls].name : e.cls);
  const zoneName = ZONES[e.zone - 1] ? ZONES[e.zone - 1].name : "the road";
  return `<div class="gearslot">
      <b>${esc(e.name)}</b>
      <div class="tiny muted">${esc(RACES[e.race] ? RACES[e.race].name : e.race)} &middot; ${path} &middot; Level ${e.level}</div>
      <div class="tiny" style="margin-top:2px">${esc(e.hoursLived)}h lived &middot; last in ${esc(zoneName)}</div>
      <div class="tiny" style="margin-top:2px; color:${statusColor}">${esc(e.status)}${e.cause ? " &middot; " + esc(e.cause) : ""}</div>
    </div>`;
}

// Achievements — earned AND unearned shown together with their rewards, so
// an unearned one reads as a goal to chase rather than a blank spoiler-free slot.

    <button class="btn ghost" id="ach-back">Back</button>`;
  document.getElementById("ach-back").addEventListener("click", () => { metaView = null; render(); });
}

// gets the one-shot flash. Module-level and deliberately not reset between
// heroes — a fresh hero renders at level 1 with no prior value to exceed, so

let prevRenderedLevel = null;

  const taskFrac = w.state === "TRAVELING"

    : w.taskProgressMs / d.taskMs;

    ${metaNavBar()}

      <div class="herosub">Level ${h.level} ${esc(CLASSES[h.cls].name)} · ${esc(RACES[h.race].name)}
        · <span class="muted">${esc(RACES[h.race].trait)}</span></div>
      <div class="barrow"><b>HP</b><div class="bar hp"><i id="hpbar" style="width:${pct(h.hp, d.maxHP)}"></i></div>
        <span id="hptext">${fmt(h.hp)} / ${fmt(d.maxHP)}</span></div>
      <div class="barrow"><b>XP</b><div class="bar xp"><i id="xpbar" style="width:${h.level>=50?100:pct(h.xp, need)}"></i></div>

        <span></span></div>
      <div class="tiny muted" id="doing" style="margin-top:2px">${esc(doing)}</div>
      <div class="footrow">
        <span><span class="zonedot">&#9679;</span> ${esc(z.name)}</span>
        <span class="gold" id="goldtext">${fmt(h.gold)} gold</span>

    </div>
    <div class="tabs">

    </div>
    <div class="card" id="tabbody">${tabBody()}</div>`;

  wireMetaNav();

  }));

  if (dis) dis.addEventListener("click", () => { pendingSummary = null; render(); });

function pct(a, b){ return Math.max(0, Math.min(100, (a / b) * 100)).toFixed(1) + "%"; }

// Merchant trip legs are shorter than a zone change, and the "traveling to
// X" line doesn't apply while ferrying gear to and from town.
function travelDurationMs(kind){
  return (kind === "merchant_out" || kind === "merchant_return")
    ? MERCHANT_SECONDS * 1000 : TRAVEL_SECONDS * 1000;
}
function doingText(S){
  const w = S.world;
  if (w.state === "TRAVELING"){
    if (w.travelKind === "merchant_out") return "Making for the merchant's stall";
    if (w.travelKind === "merchant_return") return `Returning to ${ZONES[w.zone-1].name}`;
    return `Traveling to ${ZONES[w.pendingZone-1].name}`;
  }
  if (w.state === "AT_MERCHANT") return "At the merchant's stall";
  if (w.state === "CONFRONTATION")
    return `The final reckoning with ${w.thread.antagonist} (${w.confrontation.step + 1}/${CONFRONTATION_STEPS})`;
  return w.taskName;
}

// Which log types are worth surfacing in the WYWA digest. "level" and
// "travel"/"task" are deliberately excluded — level is already the headline
// "Level X -> Y" line, travel/task are texture the tasks-completed count and
// zone line already cover, and repeating them here would just be noise on
// top of a card that's supposed to be the readable digest of the noise.
const WYWA_HIDE_TYPES = new Set(["level","travel","task"]);

// Small colored-dot classes shared with the chronicle's own tier/kind
// coloring (see chronicle rendering below) so a Legendary drop or a death
// reads the same way whether you meet it in the WYWA card or the full log.
function entryKindClass(e){
  if (e.type === "death") return "k-death";
  if (e.type === "ascension") return "k-ascension";
  if (e.type === "cheatdeath") return "k-cheatdeath";
  if (e.type === "neardeath") return "k-neardeath";
  if (e.type === "confrontation") return "k-confrontation";
  if (e.type === "achievement") return "k-achievement";
  // Every imp-2 gear entry is, by construction (see rollDrop/doMerchantTrip),
  // an Epic or Legendary equip — never a routine one — so a text match on
  // the tier word itemPhrase() already prepends is a safe, cheap way to
  // recover which of the two it was without threading tier through the log.
  if (e.type === "gear" && e.imp >= 2) return /legendary/i.test(e.text) ? "k-gear-legendary" : "k-gear-epic";
  return "";
}

function summaryCard(s, opts){
  opts = opts || {};
  const lines = [];
  lines.push(`${fmt(s.tasks)} tasks completed`);
  if (s.levelTo > s.levelFrom) lines.push(`Level ${s.levelFrom} &rarr; <b>${s.levelTo}</b>`);
  lines.push(`${fmt(s.gold)} gold earned`);
  if (s.zoneTo !== s.zoneFrom) lines.push(`Traveled to ${esc(ZONES[s.zoneTo-1].name)}`);

  const notable = s.notable.filter(e => !WYWA_HIDE_TYPES.has(e.type)).slice(-14);
  const dismissBtn = opts.dismiss === false ? "" : `<button class="dismiss" id="wywa-dismiss">Dismiss</button>`;
  const entrance = opts.entrance === false ? "" : " wywa-in";

  return `<div class="card wywa${entrance}">
    <h2>While You Were Away</h2>
    <p class="muted tiny" style="margin:0 0 8px">${esc(fmtDur(s.elapsedMs))} on the road.</p>
    <ul>${lines.map(l => `<li>${l}</li>`).join("")}</ul>
    ${notable.length ? `<div class="wywa-notable">${notable.map(e =>
        `<div class="wn-item ${entryKindClass(e)}">${esc(e.text)}</div>`).join("")}</div>` : ""}
    ${opts.statusHtml || ""}
    ${dismissBtn}
  </div>`;
}
// "Current status: alive in [zone] at [HP%]" — the last line of the digest,
// per design doc §3. Only meaningful while the hero is actually alive and
// rendering the main screen; death/ascension have their own epilogue screens
// that already say how the story ended, so they skip this line entirely.
function heroStatusHtml(){
  const h = S.hero, w = S.world, d = derived(h, S.gear);
  const hpPct = Math.max(0, Math.min(100, Math.round(100 * h.hp / d.maxHP)));
  return `<p class="wywa-status muted">Alive in ${esc(ZONES[w.zone-1].name)} at ${hpPct}% HP.</p>`;
}

// Chronicle grouping (render-only — reads existing log fields, adds/changes
// nothing in the simulation core or save schema).
//
// Sessions: a real sitting at the game, inferred from a gap in the SIMULATED
// clock between consecutive KEPT entries. During live play or an offline
// catch-up the clock advances continuously with no such gaps between
// consecutive log lines — except that only imp>=1 lines are kept forever
// (pruneLog caps routine imp0 lines at LOG_ROUTINE_MAX), so late in a long
// run — merchant trips every ~100 tasks are sometimes the only guaranteed
// permanent anchor — two KEPT entries can legitimately be 30+ real minutes
// apart with nothing pruned at all. The threshold has to clear that
// natural sparsity comfortably so it only fires on an actual return visit
// (which in practice is hours, not minutes), not on a quiet stretch of road.
const SESSION_GAP_MS = 90 * 60 * 1000;
function chronicleSessions(log){
  const sessions = [];
  let cur = null, lastT = null;
  for (const e of log){
    if (!cur || (lastT != null && e.t - lastT > SESSION_GAP_MS)) sessions.push(cur = {start: e.t, entries: []});
    cur.entries.push(e);
    lastT = e.t;
  }
  return sessions;
}
function sessionLabel(t){
  const d = new Date(t);
  return `${d.toLocaleDateString([], {month:"short", day:"numeric"})} — ${d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})}`;
}

// Chapter breaks: zone arrivals ARE the act transitions (design doc §12 maps
// one zone to one act, 5-6 folded together). ARRIVAL[] is a fixed 1-line
// template per zone with only {name} substituted, so matching a "zone"-type
// entry's stored text back against the 6 possibilities (for this hero's own
// name) recovers which zone it was without threading anything new through
// the simulation core or the save.
const ZONE_ACT_LABEL = ["I","II","III","IV","V","V"];
function zoneArrivalNumber(text, heroName){
  for (const n of Object.keys(ARRIVAL))
    if (ARRIVAL[n].replace("{name}", heroName) === text) return Number(n);
  return null;
}
function entryHtml(e, heroName){
  if (e.type === "birth" || e.type === "zone"){
    const n = e.type === "birth" ? 1 : zoneArrivalNumber(e.text, heroName);
    if (n){
      const z = ZONES[n-1];
      return `<div class="chapter">
        <div class="chapter-rule"></div>
        <b>Chapter ${ZONE_ACT_LABEL[n-1]} &middot; ${esc(z.name)}</b>
        <span>${esc(e.text)}</span>
      </div>`;
    }
  }
  const kind = entryKindClass(e);
  return `<div class="entry imp${e.imp}${kind ? " " + kind : ""}">
    <time>${new Date(e.t).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})}</time>${esc(e.text)}
  </div>`;
}
function sessionHtml(sess, heroName){
  return `<div class="session">
    <div class="session-head">${esc(sessionLabel(sess.start))}</div>
    ${sess.entries.map(e => entryHtml(e, heroName)).join("")}
  </div>`;
}

        <div>Peril frequency &middot; &times;${d.perilMult.toFixed(2)}</div>
        <div>Regeneration &middot; ${d.regenPerTask.toFixed(1)} HP per task</div>
      </div>
      <div class="effects" style="border-top:1px solid var(--line); padding-top:10px">

}

function skillsTabBody(){

function gearTabBody(){

        <div class="tiny">${esc(statText)}${item.cheatDeath ? " &middot; grants a cheat-death charge" : ""}</div>

// Cheap partial update on the 250ms loop: no innerHTML churn.
function renderLive(){
  if (!S || S.world.state === "AWAITING_CHOICE") return;
  const h = S.hero, w = S.world, d = derived(h, S.gear);
  const bar = document.getElementById("taskbar");
  if (!bar) return;
  const frac = w.state === "TRAVELING"
    ? 1 - w.travelMsLeft / travelDurationMs(w.travelKind)
    : w.taskProgressMs / d.taskMs;
  bar.style.width = pct(frac, 1);
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  const setw = (id, v) => { const el = document.getElementById(id); if (el) el.style.width = v; };
  setw("hpbar", pct(h.hp, d.maxHP));
  set("hptext", `${fmt(h.hp)} / ${fmt(d.maxHP)}`);
  setw("xpbar", h.level >= 50 ? "100%" : pct(h.xp, xpToNext(h.level)));
  set("goldtext", `${fmt(h.gold)} gold`);
  set("doing", doingText(S));
}

/* =========================== HEADLESS HARNESS ============================ */
/* simulate(n) — no rendering, no DOM, seeded. Run this before touching any
   balance number. Console: simulate(1000)                                    */

const MILESTONES = [10, 19, 29, 37, 45, 50];

function simulateOne(opts){
  const race = opts.race || pick(Object.keys(RACES).filter(k => RACES[k].starter));
  const s = createState("Sim", race, null);
  const hit = {};
  const classPick = opts.class || null;
  let elapsed = 0;
  const CHUNK = 600000;                       // 10 minutes of sim per step
  const CAP = (opts.capHours || 72) * 3600000;

  // Phase 6: reaching level 50 is no longer the end of the road — the hero
  // keeps grinding zone 6 (with the merchant's guaranteed relic offer kicking
  // in at L48+) until the ascension gate opens, fights the confrontation,
  // and lands on DEAD or ASCENDED. So the loop must NOT stop at level 50
  // anymore; it only stops on a real terminal/blocking state.
  while (elapsed < CAP){
    const left = advance(s, CHUNK);
    elapsed += CHUNK - left;
    for (const m of MILESTONES)
      if (hit[m] === undefined && s.hero.level >= m) hit[m] = elapsed / 3600000;
    if (left > 0){
      if (s.world.state === "AWAITING_CHOICE"){
        const o = s.world.pendingChoice.options;
        resolveChoice(s, classPick && o.includes(classPick) ? classPick : pick(o));
        continue;
      }
      break;                                  // DEAD or ASCENDED halts the loop
    }
  }
  return {
    hours: elapsed / 3600000,
    level: s.hero.level,
    zone: s.world.zone,
    cls: s.hero.cls,
    race,
    tasks: s.stats.tasksCompleted,
    gold: s.hero.gold,
    itemsFound: s.stats.itemsFound,
    merchantTrips: s.stats.merchantTrips || 0,
    state: s.world.state,
    // Milestone-based rather than final-state-based: a hero can reach level
    // 50 and go on to die in the confrontation (or even to an ordinary
    // zone-6 peril while still waiting on a relic), which would wrongly
    // read as "never reached 50" if this were derived from the end state.
    reached50: hit[50] !== undefined,
    died: s.world.state === "DEAD",
    ascended: s.world.state === "ASCENDED",
    diedInConfrontation: s.world.state === "DEAD" && !!s.world.diedInConfrontation,
    strandedAtCap: s.hero.level >= 50 && s.world.state === "QUESTING",
    milestones: hit,
  };
}

function median(a){
  if (!a.length) return null;
  const b = a.slice().sort((x,y) => x-y);
  const m = b.length >> 1;
  return b.length % 2 ? b[m] : (b[m-1] + b[m]) / 2;
}
const mean = a => a.length ? a.reduce((x,y) => x+y, 0) / a.length : null;
const r2 = v => v == null ? null : Math.round(v * 100) / 100;

function simulate(n, opts){
  n = n || 1000; opts = opts || {};
  const saved = rng;
  rng = mulberry32(opts.seed == null ? 12345 : opts.seed);
  const t0 = Date.now();
  const runs = [];
  for (let i = 0; i < n; i++) runs.push(simulateOne(opts));
  rng = saved;

  const finished = runs.filter(r => r.reached50);
  const deaths = runs.filter(r => r.died);
  const byMilestone = {};
  for (const m of MILESTONES){
    const v = runs.map(r => r.milestones[m]).filter(x => x !== undefined);
    byMilestone["L" + m] = {medianHours: r2(median(v)), reachedPct: r2(100 * v.length / n)};
  }
  // Phase 5 note: byClass used to group finished runs by final `cls` directly
  // — that broke silently once L25 forks everyone into a tier-2 class, so no
  // survivor's final cls is ever "soldier"/"scout"/"apprentice" anymore.
  // Group by tier-1 lineage instead (a hero who dies before L25 still counts
  // under its own class, unforked).
  const LINEAGE_OF = {};
  for (const t1 of Object.keys(ADVANCED_OF)){
    LINEAGE_OF[t1] = t1;
    for (const t2 of ADVANCED_OF[t1]) LINEAGE_OF[t2] = t1;
  }
  // NOTE (Phase 6): r.hours is now TOTAL elapsed time when the run finally
  // stopped (death or ascension), since reaching level 50 no longer halts
  // simulateOne's loop. For "hours to 50" specifically, use the milestone
  // timestamp captured the moment level 50 was first hit, not r.hours.
  const byClass = {};
  for (const c of ["soldier","scout","apprentice"]){
    const v = finished.filter(r => LINEAGE_OF[r.cls] === c).map(r => r.milestones[50]);
    if (v.length) byClass[c] = {n: v.length, medianHoursTo50: r2(median(v))};
  }
  // Advanced-class reporting so the twelve can be tuned against each other.
  // `runs` (not just `finished`) gives us the denominator for survival rate;
  // a hero's final `cls` is whatever tier-2 class it reached (or its
  // tier-1/novice class if it died before L25, hence the .length guard below).
  const byAdvancedClass = {};
  for (const c of Object.keys(ADVANCED_OF).reduce((a,k) => a.concat(ADVANCED_OF[k]), [])){
    const inClass = runs.filter(r => r.cls === c);
    if (!inClass.length) continue;
    const finishedInClass = inClass.filter(r => r.reached50);
    byAdvancedClass[c] = {
      n: inClass.length,
      survivedPct: r2(100 * finishedInClass.length / inClass.length),
      medianHoursTo50: r2(median(finishedInClass.map(r => r.milestones[50]))),
    };
  }
  const deathsByZone = {};
  for (const z of ZONES) deathsByZone[z.n] = deaths.filter(r => r.zone === z.n).length;

  const ascended = runs.filter(r => r.ascended);
  const confrontationDeaths = runs.filter(r => r.diedInConfrontation);
  const strandedAtCap = runs.filter(r => r.strandedAtCap);

  const out = {
    heroes: n,
    computeSeconds: r2((Date.now() - t0) / 1000),
    medianHoursTo50: r2(median(finished.map(r => r.milestones[50]))),
    meanHoursTo50:   r2(mean(finished.map(r => r.milestones[50]))),
    reached50Pct:    r2(100 * finished.length / n),
    survivedTo50Pct: r2(100 * finished.length / n),
    medianLifespanHours: r2(median(deaths.map(r => r.hours))),
    meanLifespanHours:   r2(mean(deaths.map(r => r.hours))),
    deathsByZone,
    medianLevelAtDeath:  r2(median(deaths.map(r => r.level))),
    medianTasks:     r2(median(runs.map(r => r.tasks))),
    medianLevel:     r2(median(runs.map(r => r.level))),
    // Phase 4 — merchant full-heals are effectively extra lives, so these
    // three matter for reading how far the death curve just shifted.
    medianItemsFound:    r2(median(runs.map(r => r.itemsFound))),
    medianMerchantTrips: r2(median(runs.map(r => r.merchantTrips))),
    medianGoldAtDeath:   r2(median(deaths.map(r => r.gold))),
    // Phase 6 — the confrontation. Target per design doc §10 is 5-10% of ALL
    // heroes (not just those who reach 50) ascending.
    ascensionRate: r2(100 * ascended.length / n),
    deathsInConfrontation: confrontationDeaths.length,
    // Sanity check on the merchant relic guarantee — should be 0 or very
    // close to it. A nonzero count means some heroes reached level 50, never
    // got an Epic+ relic, and are stuck grinding zone 6 forever.
    strandedAtCapCount: strandedAtCap.length,
    milestones: byMilestone,
    byClass,
    byAdvancedClass,
  };
  if (!opts.quiet) console.table(byMilestone);
  console.table(deathsByZone);
  if (!opts.quiet) console.table(byAdvancedClass);
  return out;
}

/**
 * Grid-search the balance knobs. sweep({gearBudget:[.15,.2], regenConDiv:[40,Infinity]}, 400)
 * runs simulate(n) for every combination and returns the headline metrics for
 * each, restoring BALANCE afterward. This is how balance changes get made —
 * never by reasoning about the formulas alone.
 */
function sweep(grid, n){
  n = n || 400;
  const keys = Object.keys(grid);
  const saved = {}; for (const k of keys) saved[k] = BALANCE[k];
  const combos = keys.reduce((acc, k) =>
    acc.flatMap(base => grid[k].map(v => Object.assign({}, base, {[k]: v}))), [{}]);
  const rows = [];
  for (const combo of combos){
    Object.assign(BALANCE, combo);
    const r = simulate(n, {quiet: true});
    rows.push(Object.assign({}, combo, {
      medianLifespanH: r.medianLifespanHours,
      survivedTo50Pct: r.survivedTo50Pct,
      medLevelAtDeath: r.medianLevelAtDeath,
      deathsByZone: r.deathsByZone,
      medHoursTo50: r.medianHoursTo50,
    }));
  }
  Object.assign(BALANCE, saved);
  console.table(rows.map(r => { const {deathsByZone, ...rest} = r; return rest; }));
  return rows;
}
window.sweep = sweep;
